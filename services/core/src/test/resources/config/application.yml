# Test-only additions to src/main/resources/application.yml. Spring Boot
# reads classpath:/config/application.yml after classpath:/application.yml,
# so these values are added to the main file instead of replacing it.

axion:
  members:
    # A realm that cannot exist (.invalid is a reserved top-level domain).
    # The core contacts the realm only when a request carries a bearer
    # token; tests that send one start a real Keycloak and override this.
    issuer: http://keycloak.invalid/realms/axion
  billing:
    expiry:
      # Tests expire charges themselves: the database is shared, and a job on
      # the real clock would expire the charges other tests create at fixed
      # times. The test of the schedule turns it back on.
      enabled: false
  events:
    resubmission:
      # Tests resubmit failed publications themselves, on a clock they move;
      # the database is shared, and a job on the real clock would hand other
      # tests' publications to their listeners at times no test chose.
      enabled: false
  rails:
    processor:
      # Tests hand the inbox's credits to billing themselves, so a credit a
      # test records stays as it left it. The tests of the schedule turn it
      # back on.
      enabled: false
    signing:
      # The public key of RFC 9421, appendix B.1.4, whose private half is
      # published: no test signs with it. Tests that send the rails' messages
      # generate a pair of their own and replace this list.
      keys:
        - id: test-key-ed25519
          public-key: MCowBQYDK2VwAyEAJrQLj5P/89iXES9+vFgrIy29clF9CC/oPPsw3c5D0bs=

spring:
  modulith:
    events:
      staleness:
        # Tests mark stale publications themselves. The monitor runs once at
        # startup, then a year later: the database is shared, and a monitor
        # on another test context's clock would fail a running test's
        # publications.
        check-interval: 365d
