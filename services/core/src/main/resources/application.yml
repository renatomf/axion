# Configuration for the core service, loaded by Spring Boot at startup.
# Values here are safe defaults for every environment; profile files
# (application-<profile>.yml) override them. Reference:
# https://docs.spring.io/spring-boot/reference/features/external-config.html

spring:
  application:
    # Identifies the service in logs and, later, in metrics and traces.
    name: finaxis-core
  autoconfigure:
    exclude:
      # Without a user store of its own, Spring Boot creates an in-memory
      # user with a generated password and logs it. Nothing in the core
      # authenticates with a username and password, so that user is only a
      # credential to leak.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      # Refuse a request body with a field its record does not define, so a
      # misspelled optional field is reported instead of silently ignored.
      fail-on-unknown-properties: true
      # Refuse 2.5, and even 2.0, for an integer, instead of truncating it:
      # amounts are integer centavos, and 100.5 must not become 100.
      accept-float-as-int: false
    mapper:
      # Refuse "100" for a number and 1 for a boolean or a string: a value of
      # the wrong JSON type is a client's bug to report, not to guess at.
      allow-coercion-of-scalars: false
  flyway:
    # Fail on a file in db/migration whose name Flyway cannot parse, instead
    # of silently skipping it.
    validate-migration-naming: true

server:
  tomcat:
    # Let filters such as created[gte] reach the application with their
    # brackets unencoded, as curl -g sends them; Tomcat otherwise refuses the
    # request with an HTML page, before any Problem Details can be written.
    relaxed-query-chars: "[,]"

finaxis:
  members:
    # The Keycloak realm that issues members' access tokens. No default:
    # each environment sets FINAXIS_MEMBERS_ISSUER, and the core does not
    # start without it.
    issuer: ${FINAXIS_MEMBERS_ISSUER}
    # The clients a member may log in through: today only the console's BFF.
    clients:
      - finaxis-console
  billing:
    # The random Pix keys that name Finaxis's account as the receiver in each
    # environment's BR Codes (billing design, section 5.3). Not secrets: every
    # payer's app shows the key of the code it reads.
    pix-keys:
      test: a2b3bccd-2305-4632-9494-a795efa6fbb1
      live: 20562ad0-9498-433a-8a93-7dd95202870c
    # The platform's city, which a payer's app shows before the payer
    # confirms. Finaxis is the receiving participant.
    merchant-city: SAO PAULO
  rails:
    signing:
      # The public keys the Pix rails sign their messages with, by key ID
      # (rails simulator design, sections 6.3 and 6.4): X.509 DER in base64.
      # No default: each environment sets FINAXIS_RAILS_SIGNING_KEY_ID and
      # FINAXIS_RAILS_SIGNING_PUBLIC_KEY, and the core does not start without
      # them. A rotation lists the old key and the new one.
      keys:
        - id: ${FINAXIS_RAILS_SIGNING_KEY_ID}
          public-key: ${FINAXIS_RAILS_SIGNING_PUBLIC_KEY}
  risk:
    # The limits of each environment's charges (billing design, section 6),
    # revised with the load tests. Amounts are in centavos. They bound what an
    # abused or broken integration can create, not what a tenant may sell.
    limits:
      test:
        amount: 100000          # R$ 1,000.00 per charge
        daily-amount: 1000000   # R$ 10,000.00 per business date
        hourly-count: 200       # charges per clock hour
      live:
        amount: 1000000         # R$ 10,000.00 per charge
        daily-amount: 20000000  # R$ 200,000.00 per business date
        hourly-count: 1000      # charges per clock hour

logging:
  structured:
    format:
      # Write console logs as one JSON object per line, in the Elastic Common
      # Schema (ECS) format, so log tools can parse and search them field by
      # field. Values in the logging MDC (such as correlation_id) become JSON
      # fields. Reference:
      # https://docs.spring.io/spring-boot/reference/features/logging.html#features.logging.structured
      console: ecs

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint over HTTP. Other endpoints
        # (env, beans, metrics...) can leak internals and stay closed.
        include: health
  endpoint:
    health:
      # Report only UP or DOWN; component details stay hidden.
      show-details: never
      probes:
        # /actuator/health/liveness and /actuator/health/readiness,
        # for container orchestrators.
        enabled: true
