# Configuration for the core service, loaded by Spring Boot at startup.
# Values here are safe defaults for every environment; profile files
# (application-<profile>.yml) override them. Reference:
# https://docs.spring.io/spring-boot/reference/features/external-config.html

spring:
  application:
    # Identifies the service in logs and, later, in metrics and traces.
    name: finaxis-core
  autoconfigure:
    exclude:
      # Without a user store of its own, Spring Boot creates an in-memory
      # user with a generated password and logs it. Nothing in the core
      # authenticates with a username and password, so that user is only a
      # credential to leak.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  flyway:
    # Fail on a file in db/migration whose name Flyway cannot parse, instead
    # of silently skipping it.
    validate-migration-naming: true

finaxis:
  members:
    # The Keycloak realm that issues members' access tokens. No default:
    # each environment sets FINAXIS_MEMBERS_ISSUER, and the core does not
    # start without it.
    issuer: ${FINAXIS_MEMBERS_ISSUER}
    # The clients a member may log in through: today only the console's BFF.
    clients:
      - finaxis-console
  billing:
    # The random Pix keys that name Finaxis's account as the receiver in each
    # environment's BR Codes (billing design, section 5.3). Not secrets: every
    # payer's app shows the key of the code it reads.
    pix-keys:
      test: a2b3bccd-2305-4632-9494-a795efa6fbb1
      live: 20562ad0-9498-433a-8a93-7dd95202870c
    # The platform's city, which a payer's app shows before the payer
    # confirms. Finaxis is the receiving participant.
    merchant-city: SAO PAULO

logging:
  structured:
    format:
      # Write console logs as one JSON object per line, in the Elastic Common
      # Schema (ECS) format, so log tools can parse and search them field by
      # field. Values in the logging MDC (such as correlation_id) become JSON
      # fields. Reference:
      # https://docs.spring.io/spring-boot/reference/features/logging.html#features.logging.structured
      console: ecs

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint over HTTP. Other endpoints
        # (env, beans, metrics...) can leak internals and stay closed.
        include: health
  endpoint:
    health:
      # Report only UP or DOWN; component details stay hidden.
      show-details: never
      probes:
        # /actuator/health/liveness and /actuator/health/readiness,
        # for container orchestrators.
        enabled: true
