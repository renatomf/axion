# Contract of the /internal API, the source of truth for its endpoints.
# Lint it with `just lint-api`; see CONTRIBUTING.md, "API contracts".
openapi: 3.1.1
info:
  title: Finaxis Internal API
  version: 0.0.1
  summary: API that the console's BFF and the intelligence service call.
  description: |
    Not exposed to tenants: these routes accept only service-authenticated
    calls on the internal network. The console's TypeScript client is
    generated from this contract.

    Conventions are those of the public API: snake_case JSON and paths,
    amounts in minor units, RFC 9457 Problem Details errors with a stable
    `code`, and authentication on every operation.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/renatomf/finaxis
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - service_token: []
tags:
  - name: Members
    description: The calling member and the organizations they belong to.
  - name: API keys
    description: >-
      The keys a tenant's systems authenticate with on the public API. A key's
      secret is shown once, when it is issued, and never again.
paths:
  /internal/me:
    get:
      operationId: getCurrentMember
      tags: [Members]
      summary: The caller's organizations and tenants
      description: >-
        Every organization the calling member belongs to, with their roles in
        it and its two tenants, one per environment. The console uses it to
        offer the member a choice of organization and environment. A member
        of no organization gets an empty list.
      responses:
        "200":
          description: The caller's organizations, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentMember"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/api_keys:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listApiKeys
      tags: [API keys]
      summary: The tenant's API keys
      description: >-
        Every key of the tenant, newest first, including revoked and expired
        ones: a key is never deleted, and its record shows what it could do.
        No secret is ever returned here. Requires `api_keys:manage`.
      responses:
        "200":
          description: The tenant's keys, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    post:
      operationId: issueApiKey
      tags: [API keys]
      summary: Issue an API key
      description: >-
        Issues a key for the tenant, with a name and scopes. The response is
        the only time the key's secret is shown: store it then. A key's
        scopes must be permissions the caller holds. A tenant has at most 10
        working keys, neither revoked nor past a roll's grace period.
        Requires `api_keys:manage` and an authentication in the last 5
        minutes; otherwise the `403` has the code `step_up_required` and an
        RFC 9470 `WWW-Authenticate` challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueApiKeyRequest"
      responses:
        "201":
          description: The key was issued; its secret is in this response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedApiKey"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage API keys (`insufficient_permission`),
            asked for a scope they do not hold (`insufficient_permission`),
            or must authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "422":
          description: >-
            Some fields are invalid (`validation_failed`, with `errors`), or
            the tenant already has 10 working keys (`limit_exceeded`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/api_keys/{key_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: revokeApiKey
      tags: [API keys]
      summary: Revoke an API key
      description: >-
        Revokes one of the tenant's keys: it stops working on the next
        request, and for good. Revoking a key that is already revoked changes
        nothing and returns it again, with its first `revoked_at`, so a
        retried request is harmless. The request has no body. Requires
        `api_keys:manage` and an authentication in the last 5 minutes;
        otherwise the `403` has the code `step_up_required` and an RFC 9470
        `WWW-Authenticate` challenge.
      responses:
        "200":
          description: The key, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage API keys (`insufficient_permission`), or
            must authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/api_keys/{key_id}/roll:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: rollApiKey
      tags: [API keys]
      summary: Roll an API key
      description: >-
        Replaces one of the tenant's keys without downtime: issues a new key
        with the same name and scopes, and lets the old one keep working for
        a grace period, so the new key can be deployed before the old one
        stops. The response is the only time the new key's secret is shown.
        A key is rolled at most once; its replacement is the key to roll
        next. The caller must hold every scope of the key. During the grace
        period both keys count towards the limit of 10 working keys; a grace
        period of zero always fits. The body is optional. Requires
        `api_keys:manage` and an authentication in the last 5 minutes;
        otherwise the `403` has the code `step_up_required` and an RFC 9470
        `WWW-Authenticate` challenge.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollApiKeyRequest"
      responses:
        "201":
          description: >-
            The key was rolled; the new key's secret is in this response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolledApiKey"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage API keys (`insufficient_permission`),
            lacks one of the key's scopes (`insufficient_permission`), or
            must authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "409":
          description: >-
            The key was revoked or already rolled (`key_not_rollable`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "422":
          description: >-
            The grace period is invalid (`validation_failed`, with `errors`),
            or the tenant already has 10 working keys (`limit_exceeded`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
components:
  parameters:
    KeyId:
      name: key_id
      in: path
      required: true
      description: >-
        One of the tenant's API keys. A key of another tenant, existing or
        not, answers `404`.
      schema:
        type: string
        pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: >-
        A tenant of an organization the caller belongs to. Any other tenant,
        existing or not, answers `404`.
      schema:
        type: string
        pattern: "^ten_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  securitySchemes:
    service_token:
      description: >-
        An OAuth 2.0 access token of a member, issued by the Keycloak realm
        `finaxis` for the audience `finaxis-core`, sent as a bearer token.
        Each member has a request budget, whatever the tenant: every response
        reports it in the `RateLimit-Policy` and `RateLimit` headers, and a
        request beyond it gets `429` with code `rate_limited`.
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CurrentMember:
      description: The organizations of the calling member.
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/MemberOrganization"
      examples:
        - organizations:
            - id: org_01jd8x3k9vfz4t2p6q5w7r8s0a
              name: Acme
              roles: [admin]
              tenants:
                - id: ten_01jd8x3k9vfz4t2p6q5w7r8s0b
                  environment: test
                  status: active
                - id: ten_01jd8x3k9vfz4t2p6q5w7r8s0c
                  environment: live
                  status: active
    MemberOrganization:
      description: An organization the caller belongs to, and their roles in it.
      type: object
      required: [id, name, roles, tenants]
      properties:
        id:
          description: The organization's ID.
          type: string
          pattern: "^org_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        name:
          description: The organization's display name.
          type: string
          maxLength: 100
        roles:
          description: >-
            The caller's roles in the organization, for display. Access is
            decided by permissions, which the roles grant.
          type: array
          items:
            type: string
            enum: [admin, finance, approver, developer, read_only]
        tenants:
          description: The organization's tenants, test first, then live.
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
    Tenant:
      description: One environment of an organization.
      type: object
      required: [id, environment, status]
      properties:
        id:
          description: >-
            The tenant's ID, which tenant-scoped routes take in their path.
          type: string
          pattern: "^ten_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        environment:
          type: string
          enum: [test, live]
        status:
          description: Only an active tenant accepts requests.
          type: string
          enum: [active, suspended, closed]
    ApiKeyList:
      description: The keys of a tenant.
      type: object
      required: [data]
      properties:
        data:
          description: The keys, newest first.
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    ApiKey:
      description: >-
        An API key as lists show it: its name, what it may do and what has
        happened to it, but never its secret.
      type: object
      required: [id, name, last_four, scopes, created_at, expires_at, revoked_at, last_used_at]
      properties:
        id:
          description: The key's ID, which rolling and revoking take in their path.
          type: string
          pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        name:
          description: The label the issuer chose.
          type: string
          minLength: 1
          maxLength: 100
        last_four:
          description: The key's last four characters, to tell keys apart.
          type: string
          pattern: "^[0-9A-Za-z]{4}$"
        scopes:
          description: What the key may do, in alphabetical order.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          description: When the key was issued.
          type: string
          format: date-time
        expires_at:
          description: >-
            When a rolled key stops working, the end of its grace period;
            null if the key was never rolled.
          type: [string, "null"]
          format: date-time
        revoked_at:
          description: When the key was revoked; null if it never was.
          type: [string, "null"]
          format: date-time
        last_used_at:
          description: >-
            When the key last authenticated a request, to within an hour; null
            if it never did.
          type: [string, "null"]
          format: date-time
      examples:
        - id: key_01jd8x3k9vfz4t2p6q5w7r8s0d
          name: Checkout
          last_four: a1B2
          scopes: ["charges:read", "charges:write"]
          created_at: "2026-11-19T12:00:00Z"
          expires_at: null
          revoked_at: null
          last_used_at: "2026-11-19T15:00:00Z"
    IssueApiKeyRequest:
      description: A key to issue.
      type: object
      required: [name, scopes]
      properties:
        name:
          description: A label for the key, to tell it apart in lists.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
        scopes:
          description: >-
            What the key may do. Every scope must be a permission the caller
            holds; a scope listed twice counts once.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiKeyScope"
      examples:
        - name: Checkout
          scopes: ["charges:read", "charges:write"]
    IssuedApiKey:
      description: >-
        A key just issued: the fields lists show, and its secret, which is
        never shown again.
      type: object
      required: [id, name, last_four, scopes, created_at, secret]
      properties:
        id:
          description: The key's ID, which rolling and revoking take in their path.
          type: string
          pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        name:
          description: The label the issuer chose.
          type: string
          minLength: 1
          maxLength: 100
        last_four:
          description: The key's last four characters, which lists show.
          type: string
          pattern: "^[0-9A-Za-z]{4}$"
        scopes:
          description: What the key may do, in alphabetical order.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          description: When the key was issued.
          type: string
          format: date-time
        secret:
          description: >-
            The whole key, sent in the `Authorization` header of the public
            API. Only its hash is stored: if it is lost, issue a new key.
          type: string
          pattern: "^sk_(test|live)_[0-9A-Za-z]{36}$"
    RollApiKeyRequest:
      description: How to roll a key.
      type: object
      properties:
        grace_period_seconds:
          description: >-
            How long the old key keeps working, in seconds, from zero to 7
            days. Zero ends it at once. Without it, 24 hours.
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
      examples:
        - grace_period_seconds: 3600
    RolledApiKey:
      description: >-
        A key just rolled: its replacement, with the secret, which is never
        shown again, and the old key as lists show it, with the end of its
        grace period in `expires_at`.
      type: object
      required: [replacement, rolled]
      properties:
        replacement:
          $ref: "#/components/schemas/IssuedApiKey"
        rolled:
          $ref: "#/components/schemas/ApiKey"
    ApiKeyScope:
      description: >-
        A permission an API key may carry. Human-only permissions, such as
        `api_keys:manage`, are never scopes.
      type: string
      enum: ["balances:read", "charges:read", "charges:write", "refunds:write", "webhooks:manage"]
