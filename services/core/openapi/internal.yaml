# Contract of the /internal API, the source of truth for its endpoints.
# Lint it with `just lint-api`; see CONTRIBUTING.md, "API contracts".
openapi: 3.1.1
info:
  title: Axion Internal API
  version: 0.0.1
  summary: API that the console's BFF and the intelligence service call.
  description: |
    Not exposed to tenants: these routes accept only service-authenticated
    calls on the internal network. The console's TypeScript client is
    generated from this contract.

    Conventions are those of the public API: snake_case JSON and paths,
    amounts in minor units, RFC 9457 Problem Details errors with a stable
    `code`, and authentication on every operation.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/renatomf/axion
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - service_token: []
tags:
  - name: Members
    description: The calling member and the organizations they belong to.
  - name: API keys
    description: >-
      The keys a tenant's systems authenticate with on the public API. A key's
      secret is shown once, when it is issued, and never again.
  - name: Webhook endpoints
    description: >-
      The URLs a tenant's events are sent to, as the public API manages them,
      for the console. Every change needs a recent authentication.
  - name: Webhook deliveries
    description: >-
      Each endpoint's delivery log, as the public API shows it, for the
      console.
  - name: Events
    description: >-
      The tenant's events as they happen, for the console to update what it
      shows without polling.
paths:
  /internal/me:
    get:
      operationId: getCurrentMember
      tags: [Members]
      summary: The caller's organizations and tenants
      description: >-
        Every organization the calling member belongs to, with their roles in
        it and its two tenants, one per environment. The console uses it to
        offer the member a choice of organization and environment. A member
        of no organization gets an empty list.
      responses:
        "200":
          description: The caller's organizations, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentMember"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/api_keys:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listApiKeys
      tags: [API keys]
      summary: The tenant's API keys
      description: >-
        Every key of the tenant, newest first, including revoked and expired
        ones: a key is never deleted, and its record shows what it could do.
        No secret is ever returned here. Requires `api_keys:manage`.
      responses:
        "200":
          description: The tenant's keys, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    post:
      operationId: issueApiKey
      tags: [API keys]
      summary: Issue an API key
      description: >-
        Issues a key for the tenant, with a name and scopes. The response is
        the only time the key's secret is shown: store it then. A key's
        scopes must be permissions the caller holds. A tenant has at most 10
        working keys, neither revoked nor past a roll's grace period.
        Requires `api_keys:manage` and an authentication in the last 5
        minutes; otherwise the `403` has the code `step_up_required` and an
        RFC 9470 `WWW-Authenticate` challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueApiKeyRequest"
      responses:
        "201":
          description: The key was issued; its secret is in this response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedApiKey"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage API keys (`insufficient_permission`),
            asked for a scope they do not hold (`insufficient_permission`),
            or must authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "422":
          description: >-
            Some fields are invalid (`validation_failed`, with `errors`), or
            the tenant already has 10 working keys (`limit_exceeded`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/api_keys/{key_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: revokeApiKey
      tags: [API keys]
      summary: Revoke an API key
      description: >-
        Revokes one of the tenant's keys: it stops working on the next
        request, and for good. Revoking a key that is already revoked changes
        nothing and returns it again, with its first `revoked_at`, so a
        retried request is harmless. The request has no body. Requires
        `api_keys:manage` and an authentication in the last 5 minutes;
        otherwise the `403` has the code `step_up_required` and an RFC 9470
        `WWW-Authenticate` challenge.
      responses:
        "200":
          description: The key, now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage API keys (`insufficient_permission`), or
            must authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/api_keys/{key_id}/roll:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: rollApiKey
      tags: [API keys]
      summary: Roll an API key
      description: >-
        Replaces one of the tenant's keys without downtime: issues a new key
        with the same name and scopes, and lets the old one keep working for
        a grace period, so the new key can be deployed before the old one
        stops. The response is the only time the new key's secret is shown.
        A key is rolled at most once; its replacement is the key to roll
        next. The caller must hold every scope of the key. During the grace
        period both keys count towards the limit of 10 working keys; a grace
        period of zero always fits. The body is optional. Requires
        `api_keys:manage` and an authentication in the last 5 minutes;
        otherwise the `403` has the code `step_up_required` and an RFC 9470
        `WWW-Authenticate` challenge.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollApiKeyRequest"
      responses:
        "201":
          description: >-
            The key was rolled; the new key's secret is in this response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolledApiKey"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage API keys (`insufficient_permission`),
            lacks one of the key's scopes (`insufficient_permission`), or
            must authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "409":
          description: >-
            The key was revoked or already rolled (`key_not_rollable`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "422":
          description: >-
            The grace period is invalid (`validation_failed`, with `errors`),
            or the tenant already has 10 working keys (`limit_exceeded`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/webhook_endpoints:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listTenantWebhookEndpoints
      tags: [Webhook endpoints]
      summary: The tenant's webhook endpoints
      description: >-
        The tenant's webhook endpoints, newest first, a page at a time,
        never with their secrets, as `GET /v1/webhook_endpoints` lists them.
        To read the next page, send the `id` of the last endpoint of this
        one as `starting_after`, while `has_more` is `true`. Requires
        `webhooks:manage`.
      parameters:
        - name: limit
          in: query
          description: How many endpoints a page holds, from 1 to 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: starting_after
          in: query
          description: >-
            The `id` of the last endpoint of the previous page; the page
            holds the endpoints created before it. Omitted, the page is the
            first.
          schema:
            type: string
            pattern: "^we_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      responses:
        "200":
          description: A page of the tenant's webhook endpoints, newest first.
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/WebhookEndpointList"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "422":
          description: >-
            Some parameters are outside their rules (`validation_failed`,
            with `errors` naming each one).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    post:
      operationId: createTenantWebhookEndpoint
      tags: [Webhook endpoints]
      summary: Register a webhook endpoint
      description: >-
        Registers an HTTPS URL to receive the tenant's events of
        `enabled_events`, as `POST /v1/webhook_endpoints` does, and returns
        the secret that signs the requests sent to it. The secret is in this
        response only: store it, or roll a new one if it is lost. The URL
        must name a host on the public internet by a domain name, on port
        443 or a port from 1024 to 65535, and every address the name
        resolves to must be public. A tenant has at most 16 endpoints.
        Requires `webhooks:manage` and an authentication in the last 5
        minutes; otherwise the `403` has the code `step_up_required` and an
        RFC 9470 `WWW-Authenticate` challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "v1.yaml#/components/schemas/CreateWebhookEndpointRequest"
      responses:
        "201":
          description: The endpoint was registered, with its secret.
          headers:
            Location:
              description: >-
                The endpoint's path,
                `/internal/tenants/{tenant_id}/webhook_endpoints/{endpoint_id}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/CreatedWebhookEndpoint"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage webhooks (`insufficient_permission`),
            the tenant is not active (`tenant_inactive`), or the caller must
            authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "422":
          description: >-
            The endpoint was not registered. Some fields are invalid or
            unknown (`validation_failed`, with `errors`; a refused `url`
            carries the rule it failed as `reason`, never the addresses its
            name resolved to), or the tenant has 16 endpoints already
            (`limit_exceeded`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/webhook_endpoints/{endpoint_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/WebhookEndpointId"
    get:
      operationId: getTenantWebhookEndpoint
      tags: [Webhook endpoints]
      summary: One of the tenant's webhook endpoints
      description: >-
        The endpoint as it is now, without its secret, which only its
        creation and a roll return. Requires `webhooks:manage`.
      responses:
        "200":
          description: The webhook endpoint.
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    patch:
      operationId: updateTenantWebhookEndpoint
      tags: [Webhook endpoints]
      summary: Update a webhook endpoint
      description: >-
        Changes the endpoint's URL, description, event types or status with
        a JSON merge patch (RFC 7396), as `PATCH /v1/webhook_endpoints/{id}`
        does: a field left out keeps its value. A new `url` is checked as at
        registration. Sending the same patch again changes nothing more.
        Requires `webhooks:manage` and an authentication in the last 5
        minutes; otherwise the `403` has the code `step_up_required` and an
        RFC 9470 `WWW-Authenticate` challenge.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "v1.yaml#/components/schemas/UpdateWebhookEndpointRequest"
          application/json:
            schema:
              $ref: "v1.yaml#/components/schemas/UpdateWebhookEndpointRequest"
      responses:
        "200":
          description: The endpoint as it is now, without its secret.
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage webhooks (`insufficient_permission`),
            the tenant is not active (`tenant_inactive`), or the caller must
            authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "422":
          description: >-
            The endpoint was not changed. Some fields are invalid, unknown or
            null where they cannot be removed (`validation_failed`, with
            `errors`; a refused `url` carries the rule it failed as
            `reason`, never the addresses its name resolved to).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    delete:
      operationId: deleteTenantWebhookEndpoint
      tags: [Webhook endpoints]
      summary: Delete a webhook endpoint
      description: >-
        Deletes the endpoint, as `DELETE /v1/webhook_endpoints/{id}` does: it
        receives no events from then on, is no longer read or listed, and no
        longer counts toward the tenant's 16 endpoints. Deleting it again
        answers `404`. Requires `webhooks:manage` and an authentication in
        the last 5 minutes; otherwise the `403` has the code
        `step_up_required` and an RFC 9470 `WWW-Authenticate` challenge.
      responses:
        "204":
          description: The endpoint was deleted.
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage webhooks (`insufficient_permission`),
            the tenant is not active (`tenant_inactive`), or the caller must
            authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/webhook_endpoints/{endpoint_id}/secret/roll:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/WebhookEndpointId"
    post:
      operationId: rollTenantWebhookEndpointSecret
      tags: [Webhook endpoints]
      summary: Roll a webhook endpoint's secret
      description: >-
        Issues a new secret to sign the requests sent to the endpoint, as
        `POST /v1/webhook_endpoints/{id}/secret/roll` does, and lets the
        current one keep signing for a grace period, so the new secret can
        be deployed before the old one stops. The new secret is in this
        response only. The secret rolls again only once the grace period has
        ended, so a retried request answers `409`. The body is optional.
        Requires `webhooks:manage` and an authentication in the last 5
        minutes; otherwise the `403` has the code `step_up_required` and an
        RFC 9470 `WWW-Authenticate` challenge.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "v1.yaml#/components/schemas/RollWebhookEndpointSecretRequest"
      responses:
        "200":
          description: The secret was rolled; the new secret is in this response only.
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/RolledWebhookEndpoint"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The caller may not manage webhooks (`insufficient_permission`),
            the tenant is not active (`tenant_inactive`), or the caller must
            authenticate again (`step_up_required`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "409":
          description: >-
            The previous roll's grace period has not ended
            (`grace_period_active`; `detail` says when it ends).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "422":
          description: >-
            The secret was not rolled: the grace period is invalid or a field
            is unknown (`validation_failed`, with `errors`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/webhook_endpoints/{endpoint_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/WebhookEndpointId"
    get:
      operationId: listTenantWebhookDeliveries
      tags: [Webhook deliveries]
      summary: An endpoint's deliveries
      description: >-
        The endpoint's deliveries, newest first, a page at a time, as
        `GET /v1/webhook_endpoints/{id}/deliveries` lists them. To read the
        next page, send the `id` of the last delivery of this one as
        `starting_after`, while `has_more` is `true`. Requires
        `webhooks:manage`.
      parameters:
        - name: limit
          in: query
          description: How many deliveries a page holds, from 1 to 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: starting_after
          in: query
          description: >-
            The `id` of the last delivery of the previous page; the page
            holds the deliveries made before it. Omitted, the page is the
            first.
          schema:
            type: string
            pattern: "^whd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        - name: status
          in: query
          description: Only the deliveries in this status.
          schema:
            $ref: "v1.yaml#/components/schemas/WebhookDeliveryStatus"
        - name: type
          in: query
          description: Only the deliveries of events of this type.
          schema:
            type: string
            enum: [charge.created, charge.paid, charge.expired, charge.refunded, payment.flagged]
      responses:
        "200":
          description: A page of the endpoint's deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "components.yaml#/responses/BadRequest"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "422":
          description: >-
            Some parameters are outside their rules (`validation_failed`,
            with `errors` naming each one).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/webhook_endpoints/{endpoint_id}/deliveries/{delivery_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/WebhookEndpointId"
      - $ref: "#/components/parameters/WebhookDeliveryId"
    get:
      operationId: getTenantWebhookDelivery
      tags: [Webhook deliveries]
      summary: One of an endpoint's deliveries
      description: >-
        The delivery as it is now, with every request sent for it, oldest
        first. Requires `webhooks:manage`.
      responses:
        "200":
          description: The delivery, with its attempts.
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/WebhookDeliveryDetail"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/webhook_endpoints/{endpoint_id}/deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/WebhookEndpointId"
      - $ref: "#/components/parameters/WebhookDeliveryId"
    post:
      operationId: replayTenantWebhookDelivery
      tags: [Webhook deliveries]
      summary: Replay one of an endpoint's deliveries
      description: >-
        Sends the delivery's event to the endpoint again, now, as
        `POST /v1/webhook_endpoints/{id}/deliveries/{delivery_id}/replay`
        does: the same `webhook-id` and body, with a fresh timestamp and
        signature, at most 10 times in 24 hours. The request follows within
        seconds in the delivery's attempts. A retried request queues another
        replay. Requires `webhooks:manage`.
      responses:
        "202":
          description: >-
            The replay is queued. The body is the delivery as it is, which
            the replay does not change.
          content:
            application/json:
              schema:
                $ref: "v1.yaml#/components/schemas/WebhookDelivery"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "409":
          description: >-
            The endpoint is disabled (`endpoint_disabled`), or the delivery
            was replayed 10 times in the last 24 hours
            (`replay_limit_reached`; `detail` says from when it can be
            replayed again).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /internal/tenants/{tenant_id}/events/stream:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: streamTenantEvents
      tags: [Events]
      summary: The tenant's events, as they happen
      description: >-
        A stream of server-sent events: each message is one of the tenant's
        public events, with the event's `id` as its `id`, its type as its
        `event`, and the event, as webhooks send it, as its `data`. A member
        receives only the types their permissions allow; charge and payment
        events need `charges:read`. Events arrive at least once and in no
        guaranteed order, as webhooks do; the console tells them apart by
        `id`. The stream is a convenience, not a record: what it misses, the
        next query shows. A client that reconnects sends `Last-Event-ID` and
        first receives the events it missed, if the core still keeps them:
        the tenant's last 200, of the last 5 minutes. Otherwise it first
        receives a `reset` message, with no `id`, and refetches what it
        shows. A comment line every 15 seconds keeps proxies from closing an
        idle stream; clients ignore it. Requires `charges:read`.
      parameters:
        - name: Last-Event-ID
          in: header
          description: >-
            The `id` of the last message the client received, to resume
            from.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The stream, open until the client closes it, or until the access
            token that opened it expires; the client then opens the next
            with a fresh token and `Last-Event-ID`.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Messages in the format of the HTML Living Standard's
                  server-sent events.
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          $ref: "components.yaml#/responses/Forbidden"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          description: >-
            The caller spent its request budget (`rate_limited`, with
            `Retry-After`), or already has as many streams open as it may:
            5 for a member, on all their tenants, and 200 for a tenant
            (`too_many_streams`). A stream frees its place when it closes.
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
components:
  parameters:
    KeyId:
      name: key_id
      in: path
      required: true
      description: >-
        One of the tenant's API keys. A key of another tenant, existing or
        not, answers `404`.
      schema:
        type: string
        pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    WebhookEndpointId:
      name: endpoint_id
      in: path
      required: true
      description: >-
        One of the tenant's webhook endpoints. An endpoint of another tenant,
        existing or not, answers `404`.
      schema:
        type: string
        pattern: "^we_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    WebhookDeliveryId:
      name: delivery_id
      in: path
      required: true
      description: >-
        One of the endpoint's deliveries. A delivery of another endpoint or
        another tenant, existing or not, answers `404`.
      schema:
        type: string
        pattern: "^whd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: >-
        A tenant of an organization the caller belongs to. Any other tenant,
        existing or not, answers `404`.
      schema:
        type: string
        pattern: "^ten_[0-7][0-9a-hjkmnp-tv-z]{25}$"
  securitySchemes:
    service_token:
      description: >-
        An OAuth 2.0 access token of a member, issued by the Keycloak realm
        `axion` for the audience `axion-core`, sent as a bearer token.
        Each member has a request budget, whatever the tenant: every response
        reports it in the `RateLimit-Policy` and `RateLimit` headers, and a
        request beyond it gets `429` with code `rate_limited`.
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CurrentMember:
      description: The organizations of the calling member.
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/MemberOrganization"
      examples:
        - organizations:
            - id: org_01jd8x3k9vfz4t2p6q5w7r8s0a
              name: Acme
              roles: [admin]
              tenants:
                - id: ten_01jd8x3k9vfz4t2p6q5w7r8s0b
                  environment: test
                  status: active
                - id: ten_01jd8x3k9vfz4t2p6q5w7r8s0c
                  environment: live
                  status: active
    MemberOrganization:
      description: An organization the caller belongs to, and their roles in it.
      type: object
      required: [id, name, roles, tenants]
      properties:
        id:
          description: The organization's ID.
          type: string
          pattern: "^org_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        name:
          description: The organization's display name.
          type: string
          maxLength: 100
        roles:
          description: >-
            The caller's roles in the organization, for display. Access is
            decided by permissions, which the roles grant.
          type: array
          items:
            type: string
            enum: [admin, finance, approver, developer, read_only]
        tenants:
          description: The organization's tenants, test first, then live.
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
    Tenant:
      description: One environment of an organization.
      type: object
      required: [id, environment, status]
      properties:
        id:
          description: >-
            The tenant's ID, which tenant-scoped routes take in their path.
          type: string
          pattern: "^ten_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        environment:
          type: string
          enum: [test, live]
        status:
          description: Only an active tenant accepts requests.
          type: string
          enum: [active, suspended, closed]
    ApiKeyList:
      description: The keys of a tenant.
      type: object
      required: [data]
      properties:
        data:
          description: The keys, newest first.
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    ApiKey:
      description: >-
        An API key as lists show it: its name, what it may do and what has
        happened to it, but never its secret.
      type: object
      required: [id, name, last_four, scopes, created_at, expires_at, revoked_at, last_used_at]
      properties:
        id:
          description: The key's ID, which rolling and revoking take in their path.
          type: string
          pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        name:
          description: The label the issuer chose.
          type: string
          minLength: 1
          maxLength: 100
        last_four:
          description: The key's last four characters, to tell keys apart.
          type: string
          pattern: "^[0-9A-Za-z]{4}$"
        scopes:
          description: What the key may do, in alphabetical order.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          description: When the key was issued.
          type: string
          format: date-time
        expires_at:
          description: >-
            When a rolled key stops working, the end of its grace period;
            null if the key was never rolled.
          type: [string, "null"]
          format: date-time
        revoked_at:
          description: When the key was revoked; null if it never was.
          type: [string, "null"]
          format: date-time
        last_used_at:
          description: >-
            When the key last authenticated a request, to within an hour; null
            if it never did.
          type: [string, "null"]
          format: date-time
      examples:
        - id: key_01jd8x3k9vfz4t2p6q5w7r8s0d
          name: Checkout
          last_four: a1B2
          scopes: ["charges:read", "charges:write"]
          created_at: "2026-11-19T12:00:00Z"
          expires_at: null
          revoked_at: null
          last_used_at: "2026-11-19T15:00:00Z"
    IssueApiKeyRequest:
      description: A key to issue.
      type: object
      required: [name, scopes]
      properties:
        name:
          description: A label for the key, to tell it apart in lists.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
        scopes:
          description: >-
            What the key may do. Every scope must be a permission the caller
            holds; a scope listed twice counts once.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiKeyScope"
      examples:
        - name: Checkout
          scopes: ["charges:read", "charges:write"]
    IssuedApiKey:
      description: >-
        A key just issued: the fields lists show, and its secret, which is
        never shown again.
      type: object
      required: [id, name, last_four, scopes, created_at, secret]
      properties:
        id:
          description: The key's ID, which rolling and revoking take in their path.
          type: string
          pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        name:
          description: The label the issuer chose.
          type: string
          minLength: 1
          maxLength: 100
        last_four:
          description: The key's last four characters, which lists show.
          type: string
          pattern: "^[0-9A-Za-z]{4}$"
        scopes:
          description: What the key may do, in alphabetical order.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          description: When the key was issued.
          type: string
          format: date-time
        secret:
          description: >-
            The whole key, sent in the `Authorization` header of the public
            API. Only its hash is stored: if it is lost, issue a new key.
          type: string
          pattern: "^sk_(test|live)_[0-9A-Za-z]{36}$"
    RollApiKeyRequest:
      description: How to roll a key.
      type: object
      properties:
        grace_period_seconds:
          description: >-
            How long the old key keeps working, in seconds, from zero to 7
            days. Zero ends it at once. Without it, 24 hours.
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
      examples:
        - grace_period_seconds: 3600
    RolledApiKey:
      description: >-
        A key just rolled: its replacement, with the secret, which is never
        shown again, and the old key as lists show it, with the end of its
        grace period in `expires_at`.
      type: object
      required: [replacement, rolled]
      properties:
        replacement:
          $ref: "#/components/schemas/IssuedApiKey"
        rolled:
          $ref: "#/components/schemas/ApiKey"
    ApiKeyScope:
      description: >-
        A permission an API key may carry. Human-only permissions, such as
        `api_keys:manage`, are never scopes.
      type: string
      enum: ["balances:read", "charges:read", "charges:write", "refunds:write", "webhooks:manage"]
