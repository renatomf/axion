# Contract of the /internal API, the source of truth for its endpoints.
# Lint it with `just lint-api`; see CONTRIBUTING.md, "API contracts".
openapi: 3.1.1
info:
  title: Finaxis Internal API
  version: 0.0.1
  summary: API that the console's BFF and the intelligence service call.
  description: |
    Not exposed to tenants: these routes accept only service-authenticated
    calls on the internal network. The console's TypeScript client is
    generated from this contract.

    Conventions are those of the public API: snake_case JSON and paths,
    amounts in minor units, RFC 9457 Problem Details errors with a stable
    `code`, and authentication on every operation.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/renatomf/finaxis
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - service_token: []
tags:
  - name: Members
    description: The calling member and the organizations they belong to.
paths:
  /internal/me:
    get:
      operationId: getCurrentMember
      tags: [Members]
      summary: The caller's organizations and tenants
      description: >-
        Every organization the calling member belongs to, with their roles in
        it and its two tenants, one per environment. The console uses it to
        offer the member a choice of organization and environment. A member
        of no organization gets an empty list.
      responses:
        "200":
          description: The caller's organizations, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentMember"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
components:
  securitySchemes:
    service_token:
      description: >-
        An OAuth 2.0 access token of a member, issued by the Keycloak realm
        `finaxis` for the audience `finaxis-core`, sent as a bearer token.
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CurrentMember:
      description: The organizations of the calling member.
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/MemberOrganization"
      examples:
        - organizations:
            - id: org_01jd8x3k9vfz4t2p6q5w7r8s0a
              name: Acme
              roles: [admin]
              tenants:
                - id: ten_01jd8x3k9vfz4t2p6q5w7r8s0b
                  environment: test
                  status: active
                - id: ten_01jd8x3k9vfz4t2p6q5w7r8s0c
                  environment: live
                  status: active
    MemberOrganization:
      description: An organization the caller belongs to, and their roles in it.
      type: object
      required: [id, name, roles, tenants]
      properties:
        id:
          description: The organization's ID.
          type: string
          pattern: "^org_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        name:
          description: The organization's display name.
          type: string
          maxLength: 100
        roles:
          description: >-
            The caller's roles in the organization, for display. Access is
            decided by permissions, which the roles grant.
          type: array
          items:
            type: string
            enum: [admin, finance, approver, developer, read_only]
        tenants:
          description: The organization's tenants, test first, then live.
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
    Tenant:
      description: One environment of an organization.
      type: object
      required: [id, environment, status]
      properties:
        id:
          description: >-
            The tenant's ID, which tenant-scoped routes take in their path.
          type: string
          pattern: "^ten_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        environment:
          type: string
          enum: [test, live]
        status:
          description: Only an active tenant accepts requests.
          type: string
          enum: [active, suspended, closed]
