# Building blocks shared by the /v1 and /internal contracts. This file is a
# fragment, not an OpenAPI document: operations reference its entries, for
# example `$ref: components.yaml#/responses/Unauthorized`.
schemas:
  Problem:
    description: >-
      An RFC 9457 Problem Details document. Every error response uses it, with
      the media type `application/problem+json`. `type` is omitted, which
      RFC 9457 reads as `about:blank`.
    type: object
    required: [title, status, code]
    properties:
      title:
        description: Short summary of the problem type, for humans; may change.
        type: string
      status:
        description: The HTTP status code.
        type: integer
        minimum: 400
        maximum: 599
      detail:
        description: Explanation of this occurrence, for humans; may change.
        type: string
      instance:
        description: The request path.
        type: string
      code:
        description: >-
          Stable, snake_case identifier of the problem. Clients branch on it,
          never on `title` or `detail`.
        type: string
        pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
      errors:
        description: >-
          The fields of the request that failed validation, one entry per
          problem. Present only when `code` is `validation_failed`.
        type: array
        minItems: 1
        items:
          $ref: "#/schemas/FieldError"
    examples:
      - title: Unauthorized
        status: 401
        detail: Authentication is required.
        instance: /v1/charges
        code: unauthorized
      - title: Unprocessable Content
        status: 422
        detail: The request has invalid fields.
        instance: /internal/tenants/ten_01jd8x3k9vfz4t2p6q5w7r8s0b/api_keys
        code: validation_failed
        errors:
          - field: name
            detail: must not be blank
  FieldError:
    description: One field of the request that failed validation.
    type: object
    required: [field, detail]
    properties:
      field:
        description: >-
          The field's path in the request body, as `name` or `scopes[0]`.
        type: string
      detail:
        description: What is wrong with the field, for humans; may change.
        type: string
parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    description: >-
      Names one logical operation, so that retrying it has the effect of one
      request. Choose a new key, such as a random UUID, for each operation, and
      send it unchanged on every retry of that operation. A key is 1 to 255
      visible ASCII characters and belongs to the tenant; it is honored for at
      least 24 hours. A repeat of a request that completed gets the first
      response again, with `Idempotent-Replayed: true`. A missing key gets
      `400` with code `idempotency_key_required`, a malformed one `400` with
      code `invalid_idempotency_key`. See the idempotency guide in `docs/api`.
    schema:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[!-~]+$"
    example: 5f0c6a8e-3b1d-4f7a-9c2e-8d4b6a1f0e37
responses:
  BadRequest:
    description: >-
      The request cannot be read, such as a body that is not valid JSON or a
      value of the wrong type.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  ValidationFailed:
    description: >-
      The request is well formed but some fields are invalid; `errors` lists
      them, with the code `validation_failed`.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  Unauthorized:
    description: The request carries no valid credential.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  Forbidden:
    description: The credential is valid but does not allow this request.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  NotFound:
    description: >-
      The resource does not exist, or belongs to a tenant the caller cannot
      reach; the two look the same.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  TooManyRequests:
    description: >-
      The caller spent its request budget, with the code `rate_limited`.
      `Retry-After` says when a retry can succeed.
    headers:
      Retry-After:
        $ref: "#/headers/Retry-After"
      RateLimit-Policy:
        $ref: "#/headers/RateLimit-Policy"
      RateLimit:
        $ref: "#/headers/RateLimit"
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  ContentTooLarge:
    description: >-
      The request body is over 64 KiB, with the code `content_too_large`.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  RequestInProgress:
    description: >-
      A request with the same `Idempotency-Key` is still running, with the code
      `request_in_progress`. Retry after `Retry-After`: the retry gets that
      request's response.
    headers:
      Retry-After:
        $ref: "#/headers/Retry-After"
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  IdempotencyKeyReused:
    description: >-
      The `Idempotency-Key` was used for a request with another path or body,
      with the code `idempotency_key_reused`. The body is compared byte for
      byte: a retry must send the same bytes.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
  InternalServerError:
    description: An unexpected error; the detail is always generic.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
headers:
  Retry-After:
    description: Whole seconds until a retry can succeed.
    schema:
      type: integer
      minimum: 1
  RateLimit-Policy:
    description: >-
      The caller's request budgets, as in the IETF draft "RateLimit header
      fields for HTTP": one member per budget, with `q` requests at once,
      refilled over `w` seconds. Sent on every authenticated response.
    schema:
      type: string
    example: '"key";q=100;w=2, "tenant";q=200;w=2'
  RateLimit:
    description: >-
      What is left of each budget named in `RateLimit-Policy`: `r` requests,
      and `t` seconds until the budget is full again. Sent on every
      authenticated response.
    schema:
      type: string
    example: '"key";r=99;t=1, "tenant";r=199;t=1'
  Idempotent-Replayed:
    description: >-
      `true` on a response repeated from an earlier request with the same
      `Idempotency-Key`: the operation did not run again. Absent otherwise.
    schema:
      type: string
      enum: ["true"]
