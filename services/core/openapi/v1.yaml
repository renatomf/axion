# Contract of the public /v1 API, the source of truth for its endpoints.
# Lint it with `just lint-api`; see CONTRIBUTING.md, "API contracts".
openapi: 3.1.1
info:
  title: Finaxis API
  version: 0.0.1
  summary: Public API that tenants' systems call to bill and receive payments.
  description: |
    Finaxis is a demonstration platform on simulated Brazilian payment rails;
    no real money moves.

    Conventions:

    - JSON properties and path segments are snake_case.
    - Amounts are integers in minor units (centavos), never decimals.
    - Every error is an RFC 9457 Problem Details document
      (`application/problem+json`) with a stable `code`.
    - Every operation requires authentication; nothing is public.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/renatomf/finaxis
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - api_key: []
paths: {}
components:
  securitySchemes:
    api_key:
      description: >-
        A tenant API key, sent as a bearer token in the `Authorization`
        header: `Authorization: Bearer sk_test_…`. The key decides the
        tenant and the scopes of the request; nothing else in the request
        can change them. A missing, malformed, unknown, revoked or expired
        key gets `401` with code `unauthorized`, the same answer whatever
        the reason; a working key of a tenant that is not active gets `403`
        with code `tenant_inactive`. Each operation requires one scope; a
        key without it gets `403` with code `insufficient_permission`.
        Each tenant and each key has a request budget: every authenticated
        response reports both in the `RateLimit-Policy` and `RateLimit`
        headers, and a request beyond either gets `429` with code
        `rate_limited` and a `Retry-After` header, in seconds.
      type: http
      scheme: bearer
