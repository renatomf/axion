# Contract of the public /v1 API, the source of truth for its endpoints.
# Lint it with `just lint-api`; see CONTRIBUTING.md, "API contracts".
openapi: 3.1.1
info:
  title: Axion API
  version: 0.0.1
  summary: Public API that tenants' systems call to bill and receive payments.
  description: |
    Axion is a demonstration platform on simulated Brazilian payment rails;
    no real money moves.

    Conventions:

    - JSON properties and path segments are snake_case.
    - Amounts are integers in minor units (centavos), never decimals.
    - Every error is an RFC 9457 Problem Details document
      (`application/problem+json`) with a stable `code`.
    - Every operation requires authentication; nothing is public.
    - Every `POST` requires an `Idempotency-Key` header, so that a retry
      never has a second effect. Request bodies are at most 64 KiB.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/renatomf/axion
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - api_key: []
tags:
  - name: Charges
    description: >-
      Requests for payment by Pix. A charge carries the BR Code the tenant
      shows its customer, as a QR code or as text to copy and paste.
  - name: Webhook endpoints
    description: >-
      The HTTPS URLs where Axion sends the tenant's events, each with the
      event types it receives and the secret that signs the requests sent
      to it.
  - name: Events
    description: >-
      What Axion sends to the tenant's webhook endpoints: a CloudEvent 1.0
      in structured JSON mode, whose `data.object` is the resource as the
      API returns it at the event's time. An event may arrive more than
      once and in any order: deduplicate by `id`, and compare `time` or the
      resource's state before overwriting newer data. Ignore fields and
      types you do not know; new ones are added without notice.
paths:
  /v1/charges:
    get:
      operationId: listCharges
      tags: [Charges]
      summary: List charges
      description: >-
        The tenant's charges, newest first, a page at a time. Charges that
        are created while a client pages through the list do not shift its
        pages: to read the next page, send the `id` of the last charge of
        this one as `starting_after`, with the same filters, while
        `has_more` is `true`. Requires `charges:read`.
      parameters:
        - name: limit
          in: query
          description: How many charges a page holds, from 1 to 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: starting_after
          in: query
          description: >-
            The `id` of the last charge of the previous page; the page holds
            the charges created before it. Omitted, the page is the first.
          schema:
            type: string
            pattern: "^ch_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        - name: status
          in: query
          description: Only the charges in this status.
          schema:
            type: string
            enum: [active, paid, partially_refunded, refunded, expired]
        - name: created[gte]
          in: query
          description: >-
            Only the charges created at or after this time, such as
            `2026-11-22T00:00:00Z`. A `+` in an offset is sent as `%2B`.
          schema:
            type: string
            format: date-time
        - name: created[lt]
          in: query
          description: Only the charges created before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of the tenant's charges, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeList"
        "400":
          description: >-
            A parameter has a value of the wrong type, such as a word for
            `limit` or a time that cannot be read (`bad_request`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `charges:read` (`insufficient_permission`), or its
            tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "422":
          description: >-
            Some parameters are outside their rules (`validation_failed`,
            with `errors` naming each one).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    post:
      operationId: createCharge
      tags: [Charges]
      summary: Create a charge
      description: >-
        Creates an active charge for the amount, with its BR Code: the text
        of the dynamic Pix QR code that the payer's bank app reads. The
        charge expires `expires_in` seconds after creation; it is then no
        longer offered for payment. The tenant is the API key's, and test
        keys create test charges. Requires `charges:write`.
      parameters:
        - $ref: "components.yaml#/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChargeRequest"
      responses:
        "201":
          description: The charge was created.
          headers:
            Location:
              description: The charge's path, `/v1/charges/{id}`.
              schema:
                type: string
            Idempotent-Replayed:
              $ref: "components.yaml#/headers/Idempotent-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "400":
          description: >-
            The body cannot be read, such as invalid JSON or a value of the
            wrong type (`bad_request`), or the `Idempotency-Key` is missing
            (`idempotency_key_required`) or malformed
            (`invalid_idempotency_key`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `charges:write` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "409":
          $ref: "components.yaml#/responses/RequestInProgress"
        "413":
          $ref: "components.yaml#/responses/ContentTooLarge"
        "422":
          description: >-
            Some fields are invalid or unknown (`validation_failed`, with
            `errors`), the charge breaks one of the tenant's limits
            (`limit_exceeded`, with `rule`), or the `Idempotency-Key` was
            used for another request (`idempotency_key_reused`). The limits
            bound what an integration can create: `amount` per charge,
            `daily_amount` of the charges created on a business date in
            `America/Sao_Paulo`, and `hourly_count` of the charges created in
            a clock hour in UTC. A refused charge is not created and counts
            toward no limit.
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /v1/charges/{id}:
    parameters:
      - $ref: "#/components/parameters/ChargeId"
    get:
      operationId: getCharge
      tags: [Charges]
      summary: Retrieve a charge
      description: >-
        The charge as it is now, with the payments it received and the
        refunds made of them: its status moves from `active` as it is paid,
        refunded or expires. Requires `charges:read`.
      responses:
        "200":
          description: The charge, its payments and its refunds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeDetail"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `charges:read` (`insufficient_permission`), or its
            tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /v1/charges/{id}/refunds:
    parameters:
      - $ref: "#/components/parameters/ChargeId"
    post:
      operationId: createRefund
      tags: [Charges]
      summary: Refund a payment
      description: >-
        Gives money back to the payer of one of the charge's payments, in
        full or in part, from the tenant's available balance. A payment can
        be refunded in several parts, never beyond its amount, for 90 days
        after the Pix rails accepted it; a charge has at most 50 refunds.
        Refunding the payment that paid the charge moves the charge to
        `partially_refunded` or `refunded`; refunding a flagged payment
        leaves the charge as it is. Requires `refunds:write`.
      parameters:
        - $ref: "components.yaml#/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: >-
            The payment was refunded. The refund is read with its charge, in
            the charge's `refunds`, so the response has no `Location`.
          headers:
            Idempotent-Replayed:
              $ref: "components.yaml#/headers/Idempotent-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          description: >-
            The body cannot be read, such as invalid JSON or a value of the
            wrong type (`bad_request`), or the `Idempotency-Key` is missing
            (`idempotency_key_required`) or malformed
            (`invalid_idempotency_key`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `refunds:write` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "409":
          $ref: "components.yaml#/responses/RequestInProgress"
        "413":
          $ref: "components.yaml#/responses/ContentTooLarge"
        "422":
          description: >-
            The refund was refused, and nothing was refunded. Some fields
            are invalid or unknown, or `payment` is not one of the charge's
            (`validation_failed`, with `errors`); the charge has received no
            payment (`charge_not_paid`); it has several and the request
            names none (`payment_required`); the amount is more than remains
            of the payment (`amount_exceeds_refundable`); the rails accepted
            the payment more than 90 days ago (`refund_window_closed`); the
            charge has 50 refunds already (`refund_limit_reached`); the
            tenant's available balance is less than the amount
            (`insufficient_balance`); or the `Idempotency-Key` was used for
            another request (`idempotency_key_reused`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /v1/webhook_endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [Webhook endpoints]
      summary: List webhook endpoints
      description: >-
        The tenant's webhook endpoints, newest first, a page at a time,
        never with their secrets. To read the next page, send the `id` of
        the last endpoint of this one as `starting_after`, while `has_more`
        is `true`. Requires `webhooks:manage`.
      parameters:
        - name: limit
          in: query
          description: How many endpoints a page holds, from 1 to 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: starting_after
          in: query
          description: >-
            The `id` of the last endpoint of the previous page; the page
            holds the endpoints created before it. Omitted, the page is the
            first.
          schema:
            type: string
            pattern: "^we_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      responses:
        "200":
          description: A page of the tenant's webhook endpoints, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "400":
          description: >-
            A parameter has a value of the wrong type, such as a word for
            `limit` (`bad_request`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `webhooks:manage` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "422":
          description: >-
            Some parameters are outside their rules (`validation_failed`,
            with `errors` naming each one).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    post:
      operationId: createWebhookEndpoint
      tags: [Webhook endpoints]
      summary: Create a webhook endpoint
      description: >-
        Registers an HTTPS URL to receive the tenant's events of
        `enabled_events`, and returns the secret that signs the requests
        sent to it. The secret is in this response only, not in the answer
        to a repeat of the request: store it, or roll a new one if it is
        lost. The URL must name a host on the public
        internet by a domain name, on port 443 or a port from 1024 to
        65535, and every address the name resolves to must be public. A
        tenant has at most 16 endpoints. Requires `webhooks:manage`.
      parameters:
        - $ref: "components.yaml#/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointRequest"
      responses:
        "201":
          description: The endpoint was registered, with its secret.
          headers:
            Location:
              description: The endpoint's path, `/v1/webhook_endpoints/{id}`.
              schema:
                type: string
            Idempotent-Replayed:
              $ref: "components.yaml#/headers/Idempotent-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebhookEndpoint"
        "400":
          description: >-
            The body cannot be read, such as invalid JSON or a value of the
            wrong type (`bad_request`), or the `Idempotency-Key` is missing
            (`idempotency_key_required`) or malformed
            (`invalid_idempotency_key`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `webhooks:manage` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "409":
          $ref: "components.yaml#/responses/RequestInProgress"
        "413":
          $ref: "components.yaml#/responses/ContentTooLarge"
        "422":
          description: >-
            The endpoint was not registered. Some fields are invalid or
            unknown (`validation_failed`, with `errors`; a refused `url`
            carries the rule it failed as `reason`, never the addresses its
            name resolved to); the tenant has 16 endpoints already
            (`limit_exceeded`); or the `Idempotency-Key` was used for
            another request (`idempotency_key_reused`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /v1/webhook_endpoints/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookEndpointId"
    get:
      operationId: getWebhookEndpoint
      tags: [Webhook endpoints]
      summary: Retrieve a webhook endpoint
      description: >-
        The endpoint as it is now, without its secret, which only its
        creation returns. Requires `webhooks:manage`.
      responses:
        "200":
          description: The webhook endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `webhooks:manage` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    patch:
      operationId: updateWebhookEndpoint
      tags: [Webhook endpoints]
      summary: Update a webhook endpoint
      description: >-
        Changes the endpoint's URL, description, event types or status with
        a JSON merge patch (RFC 7396): a field left out keeps its value. A
        new `url` is checked as at registration. Setting `status` to
        `enabled` clears `disabled_reason`; setting it to `disabled`
        disables an enabled endpoint `by_tenant` and leaves a disabled one
        with its reason. Sending the same patch again changes nothing more.
        Requires `webhooks:manage`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookEndpointRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookEndpointRequest"
      responses:
        "200":
          description: The endpoint as it is now, without its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          description: >-
            The body cannot be read, such as invalid JSON or a value of the
            wrong type (`bad_request`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `webhooks:manage` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "413":
          $ref: "components.yaml#/responses/ContentTooLarge"
        "422":
          description: >-
            The endpoint was not changed. Some fields are invalid, unknown or
            null where they cannot be removed (`validation_failed`, with
            `errors`; a refused `url` carries the rule it failed as
            `reason`, never the addresses its name resolved to).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
    delete:
      operationId: deleteWebhookEndpoint
      tags: [Webhook endpoints]
      summary: Delete a webhook endpoint
      description: >-
        Deletes the endpoint: it receives no events from then on, is no
        longer read or listed, and no longer counts toward the tenant's 16
        endpoints. Deleting it again answers `404`. Requires
        `webhooks:manage`.
      responses:
        "204":
          description: The endpoint was deleted.
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `webhooks:manage` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
  /v1/webhook_endpoints/{id}/secret/roll:
    parameters:
      - $ref: "#/components/parameters/WebhookEndpointId"
    post:
      operationId: rollWebhookEndpointSecret
      tags: [Webhook endpoints]
      summary: Roll a webhook endpoint's secret
      description: >-
        Issues a new secret to sign the requests sent to the endpoint, and
        lets the current one keep signing for a grace period, so the new
        secret can be deployed before the old one stops: until
        `previous_secret_expires_at`, each request carries a signature with
        each secret. The new secret is in this response only, not in the
        answer to a repeat of the request. The secret rolls again only once
        the grace period has ended. The body is optional. Requires
        `webhooks:manage`.
      parameters:
        - $ref: "components.yaml#/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollWebhookEndpointSecretRequest"
      responses:
        "200":
          description: The secret was rolled; the new secret is in this response only.
          headers:
            Idempotent-Replayed:
              $ref: "components.yaml#/headers/Idempotent-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolledWebhookEndpoint"
        "400":
          description: >-
            The body cannot be read, such as invalid JSON or a value of the
            wrong type (`bad_request`), or the `Idempotency-Key` is missing
            (`idempotency_key_required`) or malformed
            (`invalid_idempotency_key`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "401":
          $ref: "components.yaml#/responses/Unauthorized"
        "403":
          description: >-
            The key lacks `webhooks:manage` (`insufficient_permission`), or
            its tenant is not active (`tenant_inactive`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "404":
          $ref: "components.yaml#/responses/NotFound"
        "409":
          description: >-
            The previous roll's grace period has not ended
            (`grace_period_active`; `detail` says when it ends), or a request
            with the same `Idempotency-Key` is still running
            (`request_in_progress`; retry after `Retry-After`).
          headers:
            Retry-After:
              $ref: "components.yaml#/headers/Retry-After"
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "413":
          $ref: "components.yaml#/responses/ContentTooLarge"
        "422":
          description: >-
            The secret was not rolled. The grace period is invalid or a field
            is unknown (`validation_failed`, with `errors`), or the
            `Idempotency-Key` was used for another request
            (`idempotency_key_reused`).
          content:
            application/problem+json:
              schema:
                $ref: "components.yaml#/schemas/Problem"
        "429":
          $ref: "components.yaml#/responses/TooManyRequests"
        "500":
          $ref: "components.yaml#/responses/InternalServerError"
webhooks:
  charge.created:
    post:
      operationId: chargeCreated
      tags: [Events]
      summary: A charge was created
      description: >-
        Sent when a charge is created; it has no payment yet.
      security: []
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "#/components/schemas/ChargeCreatedEvent"
      responses:
        "2XX":
          description: >-
            The event was received. Any other status, a redirect, or no
            answer within 10 seconds is a failed attempt.
  charge.paid:
    post:
      operationId: chargePaid
      tags: [Events]
      summary: A payment settled a charge
      description: >-
        Sent once per charge, by the payment that settles it, also when
        the charge had expired before a payment accepted in time arrived.
      security: []
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "#/components/schemas/ChargePaidEvent"
      responses:
        "2XX":
          description: >-
            The event was received. Any other status, a redirect, or no
            answer within 10 seconds is a failed attempt.
  charge.expired:
    post:
      operationId: chargeExpired
      tags: [Events]
      summary: A charge expired unpaid
      description: >-
        Sent when an active charge reaches its `expires_at` unpaid.
      security: []
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "#/components/schemas/ChargeExpiredEvent"
      responses:
        "2XX":
          description: >-
            The event was received. Any other status, a redirect, or no
            answer within 10 seconds is a failed attempt.
  payment.flagged:
    post:
      operationId: paymentFlagged
      tags: [Events]
      summary: A payment did not settle its charge
      description: >-
        Sent for each payment credited to the tenant that did not settle
        its charge, with its `review_reason`, for the tenant to decide
        whether to refund it.
      security: []
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "#/components/schemas/PaymentFlaggedEvent"
      responses:
        "2XX":
          description: >-
            The event was received. Any other status, a redirect, or no
            answer within 10 seconds is a failed attempt.
  charge.refunded:
    post:
      operationId: chargeRefunded
      tags: [Events]
      summary: A payment of a charge was refunded
      description: >-
        Sent for every refund, of the settling payment or of a flagged
        one.
      security: []
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "#/components/schemas/ChargeRefundedEvent"
      responses:
        "2XX":
          description: >-
            The event was received. Any other status, a redirect, or no
            answer within 10 seconds is a failed attempt.
components:
  schemas:
    CreateChargeRequest:
      description: >-
        A charge to create. A field not listed here is refused, so a
        misspelled optional field is reported instead of ignored.
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          description: >-
            In centavos, from R$ 0.01 to R$ 1,000,000.00. An integer: `100.0`
            is refused.
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
        currency:
          description: The only currency of Pix.
          type: string
          enum: [BRL]
        description:
          description: >-
            For the tenant's own records. It is not in the BR Code, so the
            payer does not see it.
          type: string
          minLength: 1
          maxLength: 140
        expires_in:
          description: >-
            Seconds from creation until the charge expires, from 1 minute to
            7 days; 1 day when omitted, the default of the Central Bank's Pix
            API.
          type: integer
          format: int32
          minimum: 60
          maximum: 604800
          default: 86400
        metadata:
          $ref: "#/components/schemas/Metadata"
      examples:
        - amount: 10000
          currency: BRL
          description: Mensalidade de novembro
          expires_in: 1800
          metadata:
            order_id: ord_8842
    Charge:
      description: A request for payment by Pix.
      type: object
      required:
        - id
        - object
        - status
        - amount
        - currency
        - amount_refunded
        - description
        - metadata
        - pix
        - expires_at
        - paid_at
        - created_at
        - livemode
      properties:
        id:
          description: The charge's ID.
          type: string
          pattern: "^ch_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        object:
          description: The kind of object, always `charge`.
          type: string
          const: charge
        status:
          description: >-
            `active` until it is paid or expires. `paid` once a payment
            settled it; `partially_refunded` and `refunded` after refunds of
            that payment; `expired` if it expired unpaid.
          type: string
          enum: [active, paid, partially_refunded, refunded, expired]
        amount:
          description: In centavos.
          type: integer
          format: int64
        currency:
          type: string
          enum: [BRL]
        amount_refunded:
          description: In centavos, what refunds returned of the settling payment.
          type: integer
          format: int64
        description:
          description: The tenant's description; null if it gave none.
          type: [string, "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        pix:
          $ref: "#/components/schemas/ChargePix"
        expires_at:
          description: When the charge stops being offered for payment.
          type: string
          format: date-time
        paid_at:
          description: >-
            When the rails accepted the payment that settled the charge; null
            until one did.
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        livemode:
          description: >-
            `false` for a charge of the test environment, which no real
            payment can settle.
          type: boolean
      examples:
        - id: ch_01jdq8k3m4n5p6q7r8s9t0v1w2
          object: charge
          status: active
          amount: 10000
          currency: BRL
          amount_refunded: 0
          description: Mensalidade de novembro
          metadata:
            order_id: ord_8842
          pix:
            transaction_id: fx7Kq2mP9wR4tY6uA8sD3fG5h
            br_code: "00020101021226580014br.gov.bcb.pix0136a2b3bccd-2305-4632-9494-a795efa6fbb15204000053039865406100.005802BR5904Acme6009SAO PAULO62290525fx7Kq2mP9wR4tY6uA8sD3fG5h6304F475"
          expires_at: "2026-11-22T15:00:00Z"
          paid_at: null
          created_at: "2026-11-22T14:30:00Z"
          livemode: false
    ChargeDetail:
      description: >-
        A charge, with the payments it received and the refunds made of
        them. Its fields are those of a `Charge`.
      type: object
      required:
        - id
        - object
        - status
        - amount
        - currency
        - amount_refunded
        - description
        - metadata
        - pix
        - expires_at
        - paid_at
        - created_at
        - livemode
        - payments
        - refunds
      properties:
        id:
          $ref: "#/components/schemas/Charge/properties/id"
        object:
          $ref: "#/components/schemas/Charge/properties/object"
        status:
          $ref: "#/components/schemas/Charge/properties/status"
        amount:
          $ref: "#/components/schemas/Charge/properties/amount"
        currency:
          $ref: "#/components/schemas/Charge/properties/currency"
        amount_refunded:
          $ref: "#/components/schemas/Charge/properties/amount_refunded"
        description:
          $ref: "#/components/schemas/Charge/properties/description"
        metadata:
          $ref: "#/components/schemas/Charge/properties/metadata"
        pix:
          $ref: "#/components/schemas/Charge/properties/pix"
        expires_at:
          $ref: "#/components/schemas/Charge/properties/expires_at"
        paid_at:
          $ref: "#/components/schemas/Charge/properties/paid_at"
        created_at:
          $ref: "#/components/schemas/Charge/properties/created_at"
        livemode:
          $ref: "#/components/schemas/Charge/properties/livemode"
        payments:
          description: >-
            The payments the charge received, oldest first, at most 100.
            Every payment is credited to the tenant: the one whose
            `outcome` is `settled` paid the charge, and the others are
            flagged with a `review_reason` for the tenant to decide whether
            to refund them.
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Payment"
        refunds:
          description: >-
            The refunds made of the charge's payments, oldest first, each as
            its creation returned it; a charge has at most 50.
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Refund"
      examples:
        - id: ch_01jdq8k3m4n5p6q7r8s9t0v1w2
          object: charge
          status: partially_refunded
          amount: 10000
          currency: BRL
          amount_refunded: 5000
          description: Mensalidade de novembro
          metadata:
            order_id: ord_8842
          pix:
            transaction_id: fx7Kq2mP9wR4tY6uA8sD3fG5h
            br_code: "00020101021226580014br.gov.bcb.pix0136a2b3bccd-2305-4632-9494-a795efa6fbb15204000053039865406100.005802BR5904Acme6009SAO PAULO62290525fx7Kq2mP9wR4tY6uA8sD3fG5h6304F475"
          expires_at: "2026-11-22T15:00:00Z"
          paid_at: "2026-11-22T14:41:07.512Z"
          created_at: "2026-11-22T14:30:00Z"
          livemode: false
          payments:
            - id: pmt_01jdq9a2b3c4d5e6f7g8h9j0k1
              end_to_end_id: E99990011202611221441aB3dE5gH7jK
              amount: 10000
              amount_refunded: 5000
              accepted_at: "2026-11-22T14:41:07.512Z"
              outcome: settled
              review_reason: null
          refunds:
            - id: re_01jdqb7c8d9e0f1g2h3j4k5m6n
              object: refund
              charge: ch_01jdq8k3m4n5p6q7r8s9t0v1w2
              payment: pmt_01jdq9a2b3c4d5e6f7g8h9j0k1
              amount: 5000
              status: succeeded
              created_at: "2026-11-22T16:10:00Z"
    ChargeList:
      description: A page of charges, newest first.
      type: object
      required: [object, data, has_more]
      properties:
        object:
          description: The kind of object, always `list`.
          type: string
          const: list
        data:
          description: The charges of the page, at most `limit`.
          type: array
          items:
            $ref: "#/components/schemas/Charge"
        has_more:
          description: >-
            `true` if more charges follow this page; send the last one's
            `id` as `starting_after` to read them.
          type: boolean
    ChargePix:
      description: How the payer pays the charge.
      type: object
      required: [transaction_id, br_code]
      properties:
        transaction_id:
          description: >-
            The 25 letters and digits that identify the charge on the Pix
            rails; the payer's bank sends them back with the payment.
          type: string
          pattern: "^[0-9A-Za-z]{25}$"
        br_code:
          description: >-
            The text of the dynamic Pix QR code, to show as a QR code or for
            the payer to copy and paste.
          type: string
    Metadata:
      description: >-
        The tenant's own keys and values, such as its order ID: up to 20
        keys of 1 to 40 characters, each with text of up to 500. Stored and
        returned, never read by Axion. It must hold no personal data, such
        as a name, a CPF or an email address.
      type: object
      maxProperties: 20
      propertyNames:
        minLength: 1
        maxLength: 40
      additionalProperties:
        type: string
        maxLength: 500
      default: {}
    Payment:
      description: >-
        A Pix payment a charge received. Whatever its outcome, its amount
        was credited to the tenant.
      type: object
      required:
        - id
        - end_to_end_id
        - amount
        - amount_refunded
        - accepted_at
        - outcome
        - review_reason
      properties:
        id:
          description: The payment's ID.
          type: string
          pattern: "^pmt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        end_to_end_id:
          description: >-
            The payment's ID on the Pix rails, which the payer's bank shows
            the payer too.
          type: string
          pattern: "^E[0-9]{20}[0-9A-Za-z]{11}$"
        amount:
          description: In centavos, what the payer paid.
          type: integer
          format: int64
        amount_refunded:
          description: In centavos, what refunds returned of this payment.
          type: integer
          format: int64
        accepted_at:
          description: >-
            When the Pix rails accepted the payment. A payment of the
            charge's amount accepted before its `expires_at` pays the charge,
            however late Axion hears of it, so an `expired` charge can
            still become `paid`.
          type: string
          format: date-time
        outcome:
          description: >-
            `settled` for the payment that paid the charge; `flagged` for a
            payment that did not, with its `review_reason`.
          type: string
          enum: [settled, flagged]
        review_reason:
          description: >-
            Why a flagged payment did not pay the charge: another payment had
            paid it already (`charge_already_paid`), it was accepted at or
            after the charge's `expires_at` (`charge_expired`), or its
            amount differs from the charge's (`amount_mismatch`). Null for
            the settled payment.
          type: [string, "null"]
          enum: [charge_already_paid, charge_expired, amount_mismatch, null]
    CreateRefundRequest:
      description: >-
        A refund to make of one of the charge's payments. Send `{}` to
        refund all that remains of a charge's only payment. A field not
        listed here is refused.
      type: object
      additionalProperties: false
      properties:
        amount:
          description: >-
            In centavos, at most what remains of the payment; all of it when
            omitted. An integer: `100.0` is refused.
          type: integer
          format: int64
          minimum: 1
        payment:
          description: >-
            The `id` of the payment to refund, one of the charge's
            `payments`. Optional when the charge has received one payment,
            required when it has received several, so a refund never
            guesses which payer gets money back.
          type: string
          pattern: "^pmt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      examples:
        - amount: 5000
          payment: pmt_01jdq9a2b3c4d5e6f7g8h9j0k1
    Refund:
      description: Money given back to the payer of one of a charge's payments.
      type: object
      required: [id, object, charge, payment, amount, status, created_at]
      properties:
        id:
          description: The refund's ID.
          type: string
          pattern: "^re_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        object:
          description: The kind of object, always `refund`.
          type: string
          const: refund
        charge:
          description: The `id` of the refunded charge.
          type: string
          pattern: "^ch_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        payment:
          description: The `id` of the refunded payment.
          type: string
          pattern: "^pmt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        amount:
          description: In centavos, what the refund gave back.
          type: integer
          format: int64
        status:
          description: >-
            `succeeded` once the money left the tenant's available balance.
            Every refund succeeds when it is made.
          type: string
          enum: [succeeded]
        created_at:
          type: string
          format: date-time
      examples:
        - id: re_01jdqb7c8d9e0f1g2h3j4k5m6n
          object: refund
          charge: ch_01jdq8k3m4n5p6q7r8s9t0v1w2
          payment: pmt_01jdq9a2b3c4d5e6f7g8h9j0k1
          amount: 5000
          status: succeeded
          created_at: "2026-11-22T16:10:00Z"
    CreateWebhookEndpointRequest:
      description: >-
        A webhook endpoint to register. A field not listed here is refused,
        so a misspelled optional field is reported instead of ignored.
      type: object
      required: [url, enabled_events]
      additionalProperties: false
      properties:
        url:
          description: >-
            An `https` URL with a domain name, without user information or
            a fragment.
          type: string
          maxLength: 2048
        description:
          description: Up to 140 characters, for the tenant's own reference.
          type: string
          minLength: 1
          maxLength: 140
        enabled_events:
          description: >-
            The event types the endpoint receives, 1 to 20, or `["*"]` for
            every type, including those added later.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WebhookEventType"
      examples:
        - url: https://example.com/axion/webhooks
          description: Order service
          enabled_events: [charge.paid, charge.refunded]
    UpdateWebhookEndpointRequest:
      description: >-
        A JSON merge patch of a webhook endpoint: a field left out keeps its
        value, and `null` removes the description. The other fields cannot
        be removed, so `null` is refused for them. A field not listed here
        is refused.
      type: object
      additionalProperties: false
      properties:
        url:
          description: >-
            An `https` URL with a domain name, without user information or
            a fragment.
          type: string
          maxLength: 2048
        description:
          description: >-
            Up to 140 characters, for the tenant's own reference; `null`
            removes it.
          type: [string, "null"]
          minLength: 1
          maxLength: 140
        enabled_events:
          description: >-
            The event types the endpoint receives, 1 to 20, or `["*"]` for
            every type, including those added later. Replaces the list the
            endpoint has.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          description: >-
            `enabled` to receive events again; `disabled` to stop them.
          type: string
          enum: [enabled, disabled]
      examples:
        - status: disabled
        - url: https://example.com/axion/v2/webhooks
          description: null
    CreatedWebhookEndpoint:
      description: >-
        An endpoint just registered: the fields a read shows, and its
        signing secret, which is never shown again.
      type: object
      required:
        - id
        - object
        - url
        - description
        - enabled_events
        - status
        - disabled_reason
        - created_at
        - secret
      properties:
        id:
          description: The endpoint's ID.
          type: string
          pattern: "^we_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        object:
          description: The kind of object, always `webhook_endpoint`.
          type: string
          const: webhook_endpoint
        url:
          description: Where the events are sent.
          type: string
          format: uri
          maxLength: 2048
        description:
          description: The tenant's description; null if it gave none.
          type: [string, "null"]
        enabled_events:
          description: The event types the endpoint receives, sorted, or `["*"]`.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          description: Always `enabled` for a new endpoint.
          type: string
          const: enabled
        disabled_reason:
          description: Always null for a new endpoint.
          type: "null"
        created_at:
          type: string
          format: date-time
        secret:
          description: >-
            The secret that signs the requests sent to the endpoint: `whsec_`
            and 32 random bytes in base64, the format of Standard Webhooks.
            Null in the answer to a repeat of the request, with
            `Idempotent-Replayed`: the secret is shown once and stored only
            encrypted. If the first response was lost, roll the secret.
          type: [string, "null"]
          pattern: "^whsec_[0-9A-Za-z+/]{43}=$"
    RollWebhookEndpointSecretRequest:
      description: How to roll an endpoint's secret. A field not listed here is refused.
      type: object
      additionalProperties: false
      properties:
        grace_period_seconds:
          description: >-
            How long the current secret keeps signing, in seconds, from zero
            to 7 days. Zero ends it at once. Without it, 24 hours.
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
      examples:
        - grace_period_seconds: 3600
    RolledWebhookEndpoint:
      description: >-
        An endpoint whose secret was just rolled: the fields a read shows,
        its new signing secret, which is never shown again, and when the
        previous secret stops signing.
      type: object
      required:
        - id
        - object
        - url
        - description
        - enabled_events
        - status
        - disabled_reason
        - created_at
        - secret
        - previous_secret_expires_at
      properties:
        id:
          description: The endpoint's ID.
          type: string
          pattern: "^we_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        object:
          description: The kind of object, always `webhook_endpoint`.
          type: string
          const: webhook_endpoint
        url:
          description: Where the events are sent.
          type: string
          format: uri
          maxLength: 2048
        description:
          description: The tenant's description; null if it gave none.
          type: [string, "null"]
        enabled_events:
          description: >-
            The event types the endpoint receives, sorted, or `["*"]` for
            every type, including those added later.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          description: >-
            `enabled` while the endpoint receives events; `disabled` once it
            stops, for `disabled_reason`.
          type: string
          enum: [enabled, disabled]
        disabled_reason:
          description: >-
            Why a disabled endpoint receives nothing: its deliveries kept
            failing (`failing`), or the tenant disabled it (`by_tenant`).
            Null while it is enabled.
          type: [string, "null"]
          enum: [failing, by_tenant, null]
        created_at:
          type: string
          format: date-time
        secret:
          description: >-
            The new secret, in the format of the one a creation returns.
            Null in the answer to a repeat of the request, with
            `Idempotent-Replayed`: the secret is shown once and stored only
            encrypted. If this response was lost, roll the secret again once
            the grace period has ended.
          type: [string, "null"]
          pattern: "^whsec_[0-9A-Za-z+/]{43}=$"
        previous_secret_expires_at:
          description: >-
            When the previous secret stops signing: the end of the grace
            period.
          type: string
          format: date-time
    WebhookEndpoint:
      description: >-
        An HTTPS URL where Axion sends the tenant's events. An endpoint of
        a test tenant receives test events only.
      type: object
      required:
        - id
        - object
        - url
        - description
        - enabled_events
        - status
        - disabled_reason
        - created_at
      properties:
        id:
          description: The endpoint's ID.
          type: string
          pattern: "^we_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        object:
          description: The kind of object, always `webhook_endpoint`.
          type: string
          const: webhook_endpoint
        url:
          description: Where the events are sent.
          type: string
          format: uri
          maxLength: 2048
        description:
          description: The tenant's description; null if it gave none.
          type: [string, "null"]
        enabled_events:
          description: >-
            The event types the endpoint receives, sorted, or `["*"]` for
            every type, including those added later.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          description: >-
            `enabled` while the endpoint receives events; `disabled` once it
            stops, for `disabled_reason`.
          type: string
          enum: [enabled, disabled]
        disabled_reason:
          description: >-
            Why a disabled endpoint receives nothing: its deliveries kept
            failing (`failing`), or the tenant disabled it (`by_tenant`).
            Null while it is enabled.
          type: [string, "null"]
          enum: [failing, by_tenant, null]
        created_at:
          type: string
          format: date-time
      examples:
        - id: we_01jdr2m4n5p6q7r8s9t0v1w2x3
          object: webhook_endpoint
          url: https://example.com/axion/webhooks
          description: Order service
          enabled_events: [charge.paid, charge.refunded]
          status: enabled
          disabled_reason: null
          created_at: "2026-11-23T13:58:02Z"
    WebhookEndpointList:
      description: A page of webhook endpoints, newest first.
      type: object
      required: [object, data, has_more]
      properties:
        object:
          description: The kind of object, always `list`.
          type: string
          const: list
        data:
          description: The endpoints of the page, at most `limit`.
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        has_more:
          description: >-
            `true` if more endpoints follow this page; send the last one's
            `id` as `starting_after` to read them.
          type: boolean
    EventSpecVersion:
      description: The CloudEvents version, always `1.0`.
      type: string
      const: "1.0"
    EventId:
      description: >-
        The event's ID, the same in every delivery of it: a receiver that
        has seen it has nothing more to do.
      type: string
      pattern: "^evt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    EventSource:
      description: >-
        `urn:axion:test` for an event of the test environment,
        `urn:axion:live` for one of the live environment.
      type: string
      enum: ["urn:axion:test", "urn:axion:live"]
    EventTime:
      description: When it happened, in UTC with milliseconds.
      type: string
      format: date-time
    EventDataContentType:
      description: The media type of `data`, always `application/json`.
      type: string
      const: application/json
    ChargeCreatedEvent:
      description: >-
        `charge.created`: a charge was created.
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion:
          $ref: "#/components/schemas/EventSpecVersion"
        id:
          $ref: "#/components/schemas/EventId"
        source:
          $ref: "#/components/schemas/EventSource"
        type:
          type: string
          const: charge.created
        subject:
