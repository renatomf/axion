# Overrides for the `local` profile: a developer machine. Active when the
# service runs with `./gradlew bootRun`, or with
# SPRING_PROFILES_ACTIVE=local. Never active in shared environments.

spring:
  config:
    # Read the local infrastructure settings (RAILS_SIMULATOR_DB_PASSWORD,
    # RAILS_SIMULATOR_OPERATOR_TOKEN, AXION_DB_PORT) from the git-ignored
    # file Docker Compose uses, so they are defined once. The path is relative to the working directory,
    # services/rails-simulator under `./gradlew bootRun`.
    import: optional:file:../../infra/compose/.env[.properties]
  datasource:
    # The PostgreSQL started by `just up rails` (infra/compose/compose.yaml).
    url: jdbc:postgresql://localhost:${AXION_DB_PORT:5432}/rails_simulator
    username: rails_simulator
    password: ${RAILS_SIMULATOR_DB_PASSWORD}

simulator:
  core:
    # The core started with `./gradlew bootRun` in services/core.
    url: http://localhost:8080

management:
  endpoint:
    health:
      # Show each health component to help diagnose problems locally.
      show-details: always

logging:
  structured:
    format:
      # Plain text on a developer's console: easier to read than JSON. An
      # empty value turns structured logging off.
      console: ""
