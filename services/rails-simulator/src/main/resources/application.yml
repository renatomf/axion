# Configuration for the rails simulator, loaded by Spring Boot at startup.
# Values here are safe defaults for every environment; profile files
# (application-<profile>.yml) override them. Reference:
# https://docs.spring.io/spring-boot/reference/features/external-config.html

spring:
  application:
    # Identifies the service in logs and, later, in metrics.
    name: axion-rails-simulator
  autoconfigure:
    exclude:
      # Without a user store of its own, Spring Boot creates an in-memory
      # user with a generated password and logs it. Operators authenticate
      # with a token, so that user is only a credential to leak.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # The simulator's own database (rails simulator design, section 8.3). No
  # defaults: each environment sets SPRING_DATASOURCE_URL, _USERNAME and
  # _PASSWORD, and the simulator does not start without them.
  flyway:
    # Fail on a file in db/migration whose name Flyway cannot parse, instead
    # of silently skipping it.
    validate-migration-naming: true

simulator:
  core:
    # Where the core receives the rails' messages (rails simulator design,
    # section 8.2). No default: each environment sets RAILS_SIMULATOR_CORE_URL,
    # and the simulator does not start without it.
    url: ${RAILS_SIMULATOR_CORE_URL}
  operator:
    # The bearer token of the operator API. No default: each environment
    # sets RAILS_SIMULATOR_OPERATOR_TOKEN, and the simulator does not start
    # without it.
    token: ${RAILS_SIMULATOR_OPERATOR_TOKEN}
  signing:
    # The Ed25519 key that signs every message to the core (rails simulator
    # design, sections 6.3 and 6.4). No defaults: each environment sets
    # RAILS_SIMULATOR_SIGNING_KEY_ID and RAILS_SIMULATOR_SIGNING_PRIVATE_KEY
    # (PKCS #8 DER in base64), and the simulator does not start without them.
    key-id: ${RAILS_SIMULATOR_SIGNING_KEY_ID}
    private-key: ${RAILS_SIMULATOR_SIGNING_PRIVATE_KEY}
  participants:
    # Axion, the receiving participant, and the payers' institutions:
    # fictitious ISPBs that no institution in the Central Bank's lists of Pix
    # and STR participants uses (rails simulator design, section 3.2). Quoted:
    # an ISPB is a code, not a number.
    receiver: "99990001"
    payers: ["99990011", "99990012", "99990013"]

server:
  # The core listens on 8080; the simulator on 8090 (rails simulator
  # design, section 8.2), so both run on one machine.
  port: 8090

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint over HTTP. Other endpoints
        # (env, beans, metrics...) can leak internals and stay closed.
        include: health
  endpoint:
    health:
      # Report only UP or DOWN; component details stay hidden.
      show-details: never
      probes:
        # /actuator/health/liveness and /actuator/health/readiness,
        # for container orchestrators.
        enabled: true

logging:
  structured:
    format:
      # One JSON object per line in the Elastic Common Schema (ECS), as the
      # core writes, so both services' logs are searched the same way.
      console: ecs
