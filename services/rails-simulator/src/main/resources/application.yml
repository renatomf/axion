# Configuration for the rails simulator, loaded by Spring Boot at startup.
# Values here are safe defaults for every environment; profile files
# (application-<profile>.yml) override them. Reference:
# https://docs.spring.io/spring-boot/reference/features/external-config.html

spring:
  application:
    # Identifies the service in logs and, later, in metrics.
    name: finaxis-rails-simulator

server:
  # The core listens on 8080; the simulator on 8090 (rails simulator
  # design, section 8.2), so both run on one machine.
  port: 8090
