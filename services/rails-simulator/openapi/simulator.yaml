# Contract of the rails simulator's operator API, the source of truth for its
# endpoints (rails simulator design, section 7.4). Lint it with `just lint-api`.
openapi: 3.1.1
info:
  title: Finaxis Rails Simulator Operator API
  version: 0.1.0
  summary: Drives the simulated Pix rails, the core's counterpart for payments.
  description: |
    Used by tests, the core's fault-injection suite, the console's demo mode
    through its BFF, and developers. Never exposed publicly: the simulator is
    bound to localhost, and every operation requires the operator token.

    Conventions follow the simulated messages (design, section 5.1): camelCase
    JSON with ISO 20022 names, amounts as decimal strings with two fraction
    digits, times in UTC with milliseconds, and RFC 9457 Problem Details
    errors. Clients ignore fields they do not know.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/renatomf/finaxis
servers:
  - url: http://localhost:8090
    description: Local development
security:
  - operatorToken: []
tags:
  - name: Payments
    description: >-
      Pix payments of BR Codes, made by simulated payers and settled by the
      simulated SPI.
  - name: Chaos
    description: >-
      Fault rules that change how the simulator delivers its messages to the
      core, never what it settles. Rules are held in memory: a restart clears
      them.
paths:
  /pix/payments:
    post:
      operationId: payBrCode
      tags: [Payments]
      summary: Pay a BR Code
      description: >-
        A simulated payer pays the BR Code: one of the payers' institutions
        debits the payer, identifies the payment with a new EndToEndId, and the
        SPI settles it. The amount and the transaction ID are read from the
        code (tags 54 and 62-05). An expired code is paid like any other, which
        is how a late payment is produced. Not idempotent: paying one code
        twice makes two payments. The payer and the message reach the core
        only inside the credit notification; the simulator does not keep them
        anywhere else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "201":
          description: >-
            The payment is settled, and its credit notification is owed to the
            core; `delivery` says whether the core has accepted it yet.
          headers:
            Location:
              description: The payment's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            The BR Code cannot be paid; `detail` names the rule it breaks: a
            length over 512 characters, the structure, the CRC, the payload
            format, the Pix GUI, the currency, the amount or the transaction ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /pix/payments/{endToEndId}:
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Get a payment
      description: >-
        A payment the simulator settled, as recorded when it settled, with
        every delivery of its notification to the core and every attempt.
        Payments are kept for as long as the simulator's database.
      parameters:
        - name: endToEndId
          in: path
          required: true
          description: The payment's EndToEndId.
          schema:
            $ref: "#/components/schemas/EndToEndId"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No payment has this EndToEndId.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /chaos/rules:
    get:
      operationId: listFaultRules
      tags: [Chaos]
      summary: List the fault rules
      description: >-
        The rules still in force, oldest first. A rule is retired, and no
        longer listed, once it has been applied `times` times.
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultRules"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: addFaultRule
      tags: [Chaos]
      summary: Add a fault rule
      description: >-
        The rule applies to the next `times` matching attempts to deliver a
        message, then is retired. When several rules match one attempt, the
        oldest of each fault applies, and of `fail` and `lost_response`, which
        exclude each other, only the oldest. A test that matches its own
        payments by `transactionId` sees exactly its faults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaultRuleRequest"
      responses:
        "201":
          description: The rule, in force from now on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: removeFaultRules
      tags: [Chaos]
      summary: Remove every fault rule
      description: >-
        Ends every fault at once; attempts from now on are sent as they would
        be without chaos.
      responses:
        "204":
          description: No rule is in force.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /chaos/rules/{id}:
    delete:
      operationId: removeFaultRule
      tags: [Chaos]
      summary: Remove a fault rule
      description: >-
        Ends one rule before it is retired; the faults it already applied stay
        recorded on their deliveries.
      parameters:
        - name: id
          in: path
          required: true
          description: The rule's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The rule is no longer in force.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No rule in force has this id; it was never added, was removed, or is retired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: The operator token, configured as RAILS_SIMULATOR_OPERATOR_TOKEN.
  responses:
    BadRequest:
      description: >-
        The body is not JSON, lacks a required field, or has a field out of
        its limits; `detail` names the field.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The operator token is missing or wrong.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: An unexpected error; the detail is generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PaymentRequest:
      type: object
      required: [brCode]
      properties:
        brCode:
          description: >-
            The BR Code text, as a payer's app reads it from the QR code: an
            EMV Merchant-Presented Mode payload ending with its CRC16 (tag 63).
          type: string
        payer:
          description: >-
            Who pays. Personal data, synthetic. When omitted, one of a fixed
            list of synthetic people pays.
          type: object
          required: [name, taxId]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 140
            taxId:
              description: The payer's CPF, 11 digits with valid check digits.
              type: string
              pattern: "^[0-9]{11}$"
        message:
          description: The payer's message to the receiver, as in the official remittance field.
          type: string
          minLength: 1
          maxLength: 140
    PaymentCreated:
      type: object
      required: [endToEndId, settledAt, delivery]
      properties:
        endToEndId:
          $ref: "#/components/schemas/EndToEndId"
        settledAt:
          $ref: "#/components/schemas/Timestamp"
        delivery:
          $ref: "#/components/schemas/DeliveryStatus"
    Payment:
      type: object
      required: [endToEndId, transactionId, interbankSettlementAmount, debtorAgent, settledAt, deliveries]
      properties:
        endToEndId:
          $ref: "#/components/schemas/EndToEndId"
        transactionId:
          description: The BR Code's transaction ID, by which the core finds the charge.
          type: string
          pattern: "^[A-Za-z0-9]{1,25}$"
        interbankSettlementAmount:
          $ref: "#/components/schemas/Amount"
        debtorAgent:
          description: The payer's institution.
          type: object
          required: [ispb]
          properties:
            ispb:
              description: Its eight-digit ISPB, fictitious.
              type: string
              pattern: "^[0-9]{8}$"
        settledAt:
          $ref: "#/components/schemas/Timestamp"
        deliveries:
          description: The deliveries of the payment's credit notification, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
    Delivery:
      description: One delivery of a message to the core, sent at least once.
      type: object
      required: [id, kind, status, createdAt, attempts, faults]
      properties:
        id:
          type: string
          format: uuid
        kind:
          description: >-
            `original`, the notification of the payment; `duplicate`, a copy a
            chaos rule asked for; `redelivery`, one an operator asked for.
          type: string
          enum: [original, duplicate, redelivery]
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        nextAttemptAt:
          description: When it is sent next; present only while it is pending.
          allOf:
            - $ref: "#/components/schemas/Timestamp"
        attempts:
          description: Every attempt, in order.
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        faults:
          description: The chaos faults applied to it, in the order applied.
          type: array
          items:
            $ref: "#/components/schemas/AppliedFault"
    AppliedFault:
      description: A fault a chaos rule applied to one attempt.
      type: object
      required: [rule, fault, attempt]
      properties:
        rule:
          description: The id of the rule that applied it.
          type: string
          format: uuid
        fault:
          $ref: "#/components/schemas/Fault"
        attempt:
          description: The number of the attempt it applied to.
          type: integer
          minimum: 1
        waited:
          description: For `latency`, how long the attempt waited before it was sent.
          allOf:
            - $ref: "#/components/schemas/Duration"
    Attempt:
      type: object
      required: [number, attemptedAt, outcome]
      properties:
        number:
          type: integer
          minimum: 1
        attemptedAt:
          $ref: "#/components/schemas/Timestamp"
        responseStatus:
          description: The core's status code; absent when no answer came.
          type: integer
          minimum: 100
          maximum: 599
        error:
          description: >-
            Why no answer came; absent when one did. `not_sent` when a `fail`
            fault kept the attempt from being sent.
          type: string
          enum: [timeout, connection_failed, not_sent]
        outcome:
          description: >-
            `delivered`, the core accepted it; `retried`, it is tried again,
            also after an answer a `lost_response` fault discarded;
            `refused`, the core refused it for good; `failed`, the 24 hours of
            retries ran out.
          type: string
          enum: [delivered, retried, refused, failed]
    DeliveryStatus:
      description: >-
        `pending`, owed to the core; `delivered`, accepted; `refused` or
        `failed`, kept for an operator to redeliver.
      type: string
      enum: [pending, delivered, refused, failed]
    FaultRuleRequest:
      type: object
      required: [fault, times]
      properties:
        fault:
          $ref: "#/components/schemas/Fault"
        min:
          description: >-
            For `latency` only, and required by it: the shortest wait before an
            attempt is sent, an ISO 8601 duration up to `max`.
          allOf:
            - $ref: "#/components/schemas/Duration"
        max:
          description: >-
            For `latency` only, and required by it: the longest wait, an ISO
            8601 duration up to 20 seconds, under the dispatcher's 30-second
            lease on a delivery.
          allOf:
            - $ref: "#/components/schemas/Duration"
        match:
          $ref: "#/components/schemas/Match"
        times:
          description: How many matching attempts the rule applies to before it is retired.
          type: integer
          minimum: 1
          maximum: 1000
    FaultRule:
      type: object
      required: [id, fault, match, times, remaining, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fault:
          $ref: "#/components/schemas/Fault"
        min:
          description: For `latency`, the shortest wait.
          allOf:
            - $ref: "#/components/schemas/Duration"
        max:
          description: For `latency`, the longest wait.
          allOf:
            - $ref: "#/components/schemas/Duration"
        match:
          $ref: "#/components/schemas/Match"
        times:
          description: How many attempts the rule was added for.
          type: integer
          minimum: 1
        remaining:
          description: How many more attempts it applies to.
          type: integer
          minimum: 1
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    FaultRules:
      type: object
      required: [rules]
      properties:
        rules:
          description: The rules in force, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/FaultRule"
    Fault:
      description: >-
        What the rule does to each matching attempt: `latency` waits a random
        time between `min` and `max` before sending it; `fail` does not send
        it, and the delivery is retried; `lost_response` sends it, discards the
        core's answer, and the delivery is retried.
      type: string
      enum: [latency, fail, lost_response]
    Match:
      description: >-
        Which deliveries the rule applies to: those of the payment with this
        `endToEndId`, those of the BR Code with this `transactionId`, both
        when both are given, and every delivery when neither is.
      type: object
      properties:
        endToEndId:
          $ref: "#/components/schemas/EndToEndId"
        transactionId:
          type: string
          pattern: "^[A-Za-z0-9]{1,25}$"
    Duration:
      description: An ISO 8601 duration of seconds, such as `PT1.5S`.
      type: string
      pattern: "^PT[0-9]{1,2}(\\.[0-9]{1,3})?S$"
      examples: [PT1.5S]
    EndToEndId:
      description: >-
        The payment's identity on both sides: E, the payer institution's ISPB,
        the UTC minute of creation (yyyyMMddHHmm) and 11 letters or digits.
      type: string
      pattern: "^E[0-9]{8}[0-9]{12}[A-Za-z0-9]{11}$"
      examples: [E99990011202611211430aB3dE5gH7jK]
    Amount:
      type: object
      required: [amount, currency]
      properties:
        amount:
          description: A decimal string with two fraction digits, never a JSON number.
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
          examples: ["100.00"]
        currency:
          type: string
          const: BRL
    Timestamp:
      description: A time in UTC with milliseconds.
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
      examples: ["2026-11-21T14:30:12.345Z"]
    Problem:
      description: >-
        An RFC 9457 Problem Details document, with the media type
        `application/problem+json`. Every error response uses it.
      type: object
      required: [title, status]
      properties:
        type:
          description: A URI naming the problem type; `about:blank` when omitted.
          type: string
        title:
          description: Short summary of the problem type, for humans.
          type: string
        status:
          description: The HTTP status code.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: Explanation of this occurrence, for humans.
          type: string
        instance:
          description: The request path.
          type: string
