# Builds and tests the rails simulator on every push and pull request.
# `./gradlew build` runs the same gates as the core's: formatting, Error
# Prone, NullAway, zero warnings, ArchUnit and the tests.
name: Rails simulator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/rails-simulator
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK the Gradle toolchain asks for (`java` in the version catalog).
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # Validates the Gradle wrapper JAR against known checksums and caches
      # the Gradle User Home. Pull requests read the cache; only `main`
      # writes it, so a pull request cannot poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source (MIT) caching on the GitHub Actions cache, instead of
          # the default proprietary provider.
          cache-provider: basic

      - name: Build
        run: ./gradlew build

      # On failure, keep the HTML test reports so the cause can be read
      # without reproducing the failure locally.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rails-simulator-test-reports
          path: services/rails-simulator/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
