# Lints the OpenAPI contracts of the core (services/core/openapi/) with
# Spectral on every push and pull request: the standard OpenAPI rules plus
# the project's conventions, configured in .spectral.yaml and tested
# against the fixtures in services/core/openapi/rule-fixtures/.
name: API contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json (`packageManager`).
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      # --frozen-lockfile: install exactly what pnpm-lock.yaml records, and
      # fail if package.json and the lockfile disagree.
      - name: Install tooling
        run: pnpm install --frozen-lockfile

      # Each project rule must report the operations its fixture breaks.
      - name: Test lint rules
        run: pnpm run test:api-rules

      - name: Lint
        run: pnpm run lint:api
