name: Work item
description: A planned slice of work, delivered by one pull request.
labels: ["enhancement"]
body:
  - type: input
    id: roadmap
    attributes:
      label: Roadmap item
      description: The roadmap PR number and title.
      placeholder: "PR 0.02: Engineering process"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this slice delivers and why, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and what is explicitly out.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions for closing this issue.
      placeholder: "- [ ] ..."
    validations:
      required: true
