# Dependabot version updates: https://docs.github.com/code-security/dependabot
# Ecosystems are added as they appear in the repository.
version: 2

updates:
  # Workflow actions are pinned by commit SHA; Dependabot bumps the SHA
  # and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Root tooling (Lefthook, commitlint), managed with pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      repository-tooling:
        patterns: ["*"]

  # Core service build: Gradle wrapper, plugins and the version catalog.
  - package-ecosystem: gradle
    directory: /services/core
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      core-dependencies:
        patterns: ["*"]

  # Rails simulator build, its own Gradle project; bumped apart from the core's.
  - package-ecosystem: gradle
    directory: /services/rails-simulator
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      rails-simulator-dependencies:
        patterns: ["*"]

  # Local infrastructure images in infra/compose. Tag and digest are bumped
  # together. Major versions follow the design doc and are upgraded by hand.
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # Base images of the core's Dockerfile; tag and digest are bumped together.
  - package-ecosystem: docker
    directory: /services/core
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      core-images:
        patterns: ["*"]

  # Base images of the rails simulator's Dockerfile, bumped like the core's.
  - package-ecosystem: docker
    directory: /services/rails-simulator
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      rails-simulator-images:
        patterns: ["*"]
