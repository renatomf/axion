# Local development infrastructure. Start it from the repository root with
# `just up`; see CONTRIBUTING.md (Local infrastructure).
#
# Services join a profile so only what a task needs is started:
#   core  PostgreSQL for the core service
#   auth  PostgreSQL and Keycloak, for the console and authentication tests
#   rails PostgreSQL and the rails simulator, the core's counterpart for payments
#   jobs  one-shot setup jobs, run by `just up`
name: axion

services:
  postgres:
    profiles: [core, auth, rails]
    # Pinned by digest: a tag can be moved, a digest cannot.
    # Dependabot bumps the tag and the digest together.
    image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      POSTGRES_DB: axion
      POSTGRES_USER: axion
      # Read from infra/compose/.env (git-ignored); see .env.example.
      POSTGRES_PASSWORD: ${AXION_DB_PASSWORD:?set AXION_DB_PASSWORD in infra/compose/.env}
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      # AXION_DB_PORT changes the host port if 5432 is already taken.
      - "127.0.0.1:${AXION_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=axion --dbname=axion"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: gives axion_app, the role the core service logs in as, its
  # login and password, then exits. Idempotent; `just up` runs it on every
  # start with `compose run`, since `up --wait` counts a job that exits as failed.
  core-database:
    profiles: [jobs]
    image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      PGHOST: postgres
      PGUSER: axion
      PGDATABASE: axion
      PGPASSWORD: ${AXION_DB_PASSWORD:?set AXION_DB_PASSWORD in infra/compose/.env}
      AXION_APP_DB_PASSWORD: ${AXION_APP_DB_PASSWORD:?set AXION_APP_DB_PASSWORD in infra/compose/.env}
    command: [psql, --no-psqlrc, --set=ON_ERROR_STOP=1, --file=/scripts/create-login-role.sql]
    volumes:
      - ../postgres/create-login-role.sql:/scripts/create-login-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot job: creates Keycloak's own role and database on this server
  # (ADR 0005), then exits. Idempotent, so it runs on every start.
  keycloak-database:
    profiles: [auth]
    image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      PGHOST: postgres
      PGUSER: axion
      PGDATABASE: axion
      PGPASSWORD: ${AXION_DB_PASSWORD:?set AXION_DB_PASSWORD in infra/compose/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/compose/.env}
    command:
      - bash
      - -c
      - psql --no-psqlrc --set=ON_ERROR_STOP=1 --set=password="$$KEYCLOAK_DB_PASSWORD" --file=/scripts/create-database.sql
    volumes:
      - ../keycloak/create-database.sql:/scripts/create-database.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Identity provider for people (ADR 0005). Production mode over plain HTTP,
  # acceptable only because it is bound to localhost.
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    # Imports infra/keycloak/realms/*.json at startup. A realm that already
    # exists is left as it is; see CONTRIBUTING.md (Keycloak).
    command: [start, --import-realm]
    # The JVM sizes its heap from this limit (70% of it) instead of the
    # host's memory; ADR 0005 budgets about 1 GB.
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/compose/.env}
      # A fixed public URL: tokens carry the same issuer whoever asks for them.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Temporary administrator of the master realm, created on the first start.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/compose/.env}
      # Replaces the ${AXION_CONSOLE_CLIENT_SECRET} placeholder in the realm file.
      AXION_CONSOLE_CLIENT_SECRET: ${AXION_CONSOLE_CLIENT_SECRET:?set AXION_CONSOLE_CLIENT_SECRET in infra/compose/.env}
    ports:
      # KEYCLOAK_PORT changes the host port if 8180 is already taken.
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: ask the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      keycloak-database:
        condition: service_completed_successfully

  # One-shot job: creates the rails simulator's own role and database on this
  # server (rails simulator design, section 8.3), then exits. Idempotent, so it
  # runs on every start.
  rails-simulator-database:
    profiles: [rails]
    image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      PGHOST: postgres
      PGUSER: axion
      PGDATABASE: axion
      PGPASSWORD: ${AXION_DB_PASSWORD:?set AXION_DB_PASSWORD in infra/compose/.env}
      RAILS_SIMULATOR_DB_PASSWORD: ${RAILS_SIMULATOR_DB_PASSWORD:?set RAILS_SIMULATOR_DB_PASSWORD in infra/compose/.env}
    command: [psql, --no-psqlrc, --set=ON_ERROR_STOP=1, --file=/scripts/create-database.sql]
    volumes:
      - ../rails-simulator/create-database.sql:/scripts/create-database.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The simulated payment rails (rails simulator design, section 8), built
  # from services/rails-simulator. No `image:` key: the image is local, so
  # Dependabot has no registry tag to bump here; it bumps the Dockerfile's.
  rails-simulator:
    profiles: [rails]
    build: ../../services/rails-simulator
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rails_simulator
      SPRING_DATASOURCE_USERNAME: rails_simulator
      SPRING_DATASOURCE_PASSWORD: ${RAILS_SIMULATOR_DB_PASSWORD:?set RAILS_SIMULATOR_DB_PASSWORD in infra/compose/.env}
      RAILS_SIMULATOR_OPERATOR_TOKEN: ${RAILS_SIMULATOR_OPERATOR_TOKEN:?set RAILS_SIMULATOR_OPERATOR_TOKEN in infra/compose/.env}
      RAILS_SIMULATOR_SIGNING_KEY_ID: ${RAILS_SIMULATOR_SIGNING_KEY_ID:?run just up rails to generate the signing key}
      RAILS_SIMULATOR_SIGNING_PRIVATE_KEY: ${RAILS_SIMULATOR_SIGNING_PRIVATE_KEY:?run just up rails to generate the signing key}
      # The core runs on the host, outside Compose (rails simulator design,
      # section 8.2).
      RAILS_SIMULATOR_CORE_URL: http://host.docker.internal:8080
    # Docker Desktop defines host.docker.internal; on Linux, map it to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Bound to localhost only: the simulator is never exposed to the network.
      # RAILS_SIMULATOR_PORT changes the host port if 8090 is already taken.
      - "127.0.0.1:${RAILS_SIMULATOR_PORT:-8090}:8090"
    # No healthcheck: the distroless image has no shell or HTTP client to call
    # /actuator/health from inside. Callers ask the endpoint from outside.
    depends_on:
      rails-simulator-database:
        condition: service_completed_successfully

volumes:
  postgres-data:
