# Gitleaks configuration: https://github.com/gitleaks/gitleaks#configuration
#
# Found automatically by `gitleaks git .` at the repository root, so the
# pre-commit hook (lefthook.yml) and CI (.github/workflows/gitleaks.yml) both
# apply it.

title = "Axion"

# Keep every built-in rule; the rules below are added to them.
[extend]
useDefault = true

# Axion API keys (tenancy and access design, section 4.3): the prefix, then
# 30 random and 6 checksum characters in base62. Gitleaks cannot verify the
# CRC32 checksum, so any text of this shape is reported; tests generate their
# keys at run time instead of writing them down.
[[rules]]
id = "axion-api-key"
description = "Axion API key"
regex = '''\bsk_(?:live|test)_[0-9A-Za-z]{36}\b'''
keywords = ["sk_live_", "sk_test_"]

# The Ed25519 test key of RFC 9421 (appendix B.1.4), published in the RFC so
# that implementations can reproduce its signatures. The simulator's signer
# test does; the key signs nothing else. The path accepts any package root, as
# the history holds the test under an earlier one.
[[allowlists]]
description = "RFC 9421 test-key-ed25519"
condition = "AND"
paths = ['''^services/rails-simulator/src/test/java/dev/[a-z]+/simulator/delivery/MessageSignerTest\.java$''']
regexes = ['''MC4CAQAwBQYDK2VwBCIEIJ\+DYvh6SEqVTm50DFtMDoQikTmiCqirVv9mWG9qfSnF''']
