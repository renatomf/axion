# Git hooks managed by Lefthook: https://lefthook.dev
# Installed by `pnpm install` through the `prepare` script in package.json.
#
# Hooks are a fast local guardrail, not a security boundary: they can be
# skipped with `git commit --no-verify`, so CI repeats the checks that matter.

pre-commit:
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner .

    - name: editorconfig
      run: editorconfig-checker {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
